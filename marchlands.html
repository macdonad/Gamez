<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<meta name="description" content="A fast solo war of villages. Build up, raid barbarians and take rival lords' villages with noblemen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312191c'/%3E%3Cpath d='M12 52V26h8v-6h6v6h4v-14h4v14h4v-6h6v6h8v26z' fill='%23d9aa4a'/%3E%3Cpath d='M28 52V40a4 4 0 018 0v12z' fill='%2312191c'/%3E%3C/svg%3E">
<title>Marchlands</title>
<style>
/* Layout: war table. Resource strip on top, ledger tabs on the left, chart map and target dossier on the right. Single dark look by choice. */
:root{color-scheme:dark;--ground:#0f1417;--panel:#171f24;--panel2:#1e292f;--line:#2c3a41;--ink:#e8e4d6;--mute:#8e9da3;--brass:#d9aa4a;--brass-ink:#1b1405;--wood:#c68f55;--clay:#d3734f;--iron:#8fb5cb;--good:#86ba6c;--bad:#ea684f;--warn:#e7b74f;--f-disp:Georgia,'Times New Roman',serif;--f-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;background:var(--ground);color:var(--ink)}
#app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-disp);font-size:30px;letter-spacing:.02em;color:var(--brass);line-height:1}
.vsel{display:flex;flex-direction:column;min-width:0}
.vsel b{font-size:16px}.vsel small{color:var(--mute)}
.res{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 380px;min-width:0}
.chip{flex:1 1 104px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.chip .l{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.chip .v{font-family:var(--f-mono);font-size:16px}
.chip .v small{color:var(--mute);font-size:11px}
.meter{height:3px;background:var(--line);margin-top:3px}.meter i{display:block;height:100%}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:3px;padding:6px 12px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}
.btn.on{border-color:var(--brass);color:var(--brass)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.clock{font-size:13px;color:var(--mute)}
#alert{display:none;margin-top:10px;background:#2a1613;border:1px solid var(--bad);border-radius:4px;padding:8px 12px;color:#ffd9d1}
#alert b{color:var(--bad)}
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mute);font-weight:500}
.tab.on{color:var(--brass);border-bottom-color:var(--brass)}
.tab i{font-style:normal;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
#panel{padding-top:10px;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:8px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row .nm b{font-size:16px}.row .nm small{display:block;color:var(--mute)}
.lv{font-family:var(--f-mono);color:var(--brass)}
.costs{display:flex;flex-wrap:wrap;gap:3px 10px;font-family:var(--f-mono);font-size:12px}
.costs span.no{color:var(--bad)}
.w{color:var(--wood)}.c{color:var(--clay)}.i{color:var(--iron)}
.tag{display:inline-block;font-size:12px;color:var(--mute)}
@media(max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row>.btn,.row>.qty,.row>.mono{grid-column:2;grid-row:1}.row>div:nth-child(2){grid-column:1/-1;grid-row:2}}
.queue{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin-bottom:6px}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:3px 0}
.qrow .bar{grid-column:1/-1}
.bar{height:4px;background:var(--line)}.bar i{display:block;height:100%;background:var(--brass)}
.x{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12px}
.qty{display:flex;gap:4px;align-items:center}
input[type=number]{width:64px;background:var(--ground);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:4px 6px;font-family:var(--f-mono)}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 10px}
h3{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:14px 0 4px;color:var(--brass);letter-spacing:.02em}
h3:first-child{margin-top:4px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0f1613;aspect-ratio:1/1;max-width:100%}
#map{display:block;width:100%;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:6px 0}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;background:var(--lc);border-radius:2px}
#target{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
#target h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;line-height:1.1}
.own{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#10130f;font-weight:700;margin-left:6px;vertical-align:middle}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0;color:var(--mute);font-size:13px}
.kv b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.send{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.send label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.send .in{display:flex;gap:4px;align-items:center}
.send input{width:100%;min-width:0}
.intel{background:var(--panel2);border-radius:3px;padding:6px 10px;font-size:13px;margin:6px 0}
.rep{border-bottom:1px solid var(--line);padding:8px 0}
.rep summary,.rep .hd{cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.rep .hd b.win{color:var(--good)}.rep .hd b.loss{color:var(--bad)}.rep .hd b.neu{color:var(--iron)}
.rep.unread .hd span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-right:7px}
.rep .body{margin:6px 0 2px;font-size:13px;color:var(--mute);display:grid;gap:3px}
.rep .body b{color:var(--ink);font-weight:500}
.empty{color:var(--mute);padding:14px 0}
#toasts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:20;max-width:min(340px,calc(100vw - 24px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brass);padding:7px 11px;border-radius:3px;font-size:14px;animation:in .2s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#overlay{position:fixed;inset:0;background:rgba(8,11,13,.93);z-index:30;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.on{display:flex}
.card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:4px}
.card h1{font-family:var(--f-disp);font-weight:400;font-size:54px;color:var(--brass);margin:0;line-height:1}
.card p{color:var(--ink)}
.card ul{color:var(--mute);padding-left:18px;margin:8px 0 16px}
.card .ctl{margin:10px 0}
#scene{margin-bottom:12px;min-width:0}
.scene{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#14221a}
.sl{font:500 11px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#a9b6bb}
.sn{fill:#d9aa4a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sq{fill:#e7b74f;animation:pulse 1.4s ease-in-out infinite}
.splot{fill:none;stroke:#3e4d44;stroke-width:1.5;stroke-dasharray:4 4}
@keyframes pulse{50%{opacity:.35}}
.smk{opacity:0;animation:rise 4.2s ease-out infinite}.smk.s2{animation-delay:1.4s}.smk.s3{animation-delay:2.8s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.5}100%{opacity:0;transform:translate(7px,-26px) scale(1.7)}}
.smk{transform-box:fill-box;transform-origin:center}
.flagw{transform-box:fill-box;transform-origin:left center;animation:wave 2.2s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(5deg) scaleX(.93)}}
.flick{transform-box:fill-box;transform-origin:bottom center;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.8,1.15)}}
.garr{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:6px;font-family:var(--f-mono);font-size:13px}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.uc{display:inline-flex;align-items:center;gap:4px;margin-right:6px;white-space:nowrap}
.ic-spear,.ic-sword{color:var(--iron)}.ic-axe,.ic-cav{color:var(--clay)}.ic-scout{color:var(--good)}.ic-noble{color:var(--brass)}
.bi{width:20px;height:20px;margin-right:7px;vertical-align:-4px;color:var(--brass)}
.bi.ic-spear,.bi.ic-sword{color:var(--iron)}.bi.ic-axe,.bi.ic-cav{color:var(--clay)}.bi.ic-scout{color:var(--good)}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.sq,.smk,.flagw,.flick{animation:none}.smk{opacity:.25}}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="brand">Marchlands</div>
  <div class="vsel"><b id="vname"></b><small id="vsub"></small></div>
  <div class="res" id="res"></div>
  <div class="ctl">
   <button class="btn ghost sm" data-act="pause" id="bpause">Pause</button>
   <button class="btn ghost sm" data-act="speed" data-v="1">1x</button>
   <button class="btn ghost sm" data-act="speed" data-v="2">2x</button>
   <button class="btn ghost sm" data-act="speed" data-v="4">4x</button>
   <button class="btn ghost sm" data-act="menu">Menu</button>
  </div>
  <div class="clock mono" id="clock"></div>
 </div>
 <div id="alert"></div>
 <div class="main">
  <section>
   <div id="scene"></div>
   <div class="tabs" id="tabs"></div>
   <div id="panel"></div>
  </section>
  <section>
   <div class="mapbox"><canvas id="map"></canvas></div>
   <div class="legend" id="legend"></div>
   <div id="target"></div>
  </section>
 </div>
</div>
<div id="toasts"></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script>

'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SAVE='marchlands.save.v1', MAP=26, RES=['w','c','i'];
const DIFF=[{n:'Easy',mult:.9,grace:600,rate:.7},{n:'Normal',mult:1.2,grace:420,rate:.85},{n:'Hard',mult:1.6,grace:300,rate:1.1}];
const LORDS=[{name:'You',color:'#e3b04b'},{name:'Lord Varrick',color:'#e0634b',p:'raider'},{name:'Dame Orsolya',color:'#5b9bdc',p:'builder'},{name:'Baron Hesk',color:'#a57be0',p:'warlord'},{name:'Lady Ilvane',color:'#46bfa6',p:'raider'}];
const BARB='#8b918d';
const NAMES=['Ashford','Blackmere','Cinderholt','Dunmoor','Eastwatch','Fallowgate','Greywick','Harrowdene','Ironvale','Jarlsby','Kettlefen','Lowmarsh','Mirewood','Northcairn','Oakhollow','Pinesend','Quarrel','Ravenhill','Stonebridge','Thornby','Underhill','Vexley','Wolfsden','Yarrow','Zennor','Brackwater','Coldharbour','Dreadfen','Elmstead','Frostholm','Gallows Rise','Hollin','Imber','Kingsmoor','Larkspur','Marrow','Nethercott','Ormside','Pellar','Rookery','Saltmarsh','Tamsin','Ulwick','Wend'];
const U={
 spear:{n:'Spearman',c:[50,30,10],pop:1,t:8,a:10,d:25,carry:25,sp:.4,b:'barracks'},
 sword:{n:'Swordsman',c:[30,30,70],pop:1,t:11,a:25,d:50,carry:15,sp:.38,b:'barracks'},
 axe:{n:'Axeman',c:[60,30,40],pop:1,t:10,a:40,d:10,carry:10,sp:.4,b:'barracks'},
 scout:{n:'Scout',c:[30,30,30],pop:2,t:12,a:0,d:2,carry:0,sp:1.2,b:'stable'},
 cav:{n:'Light Cavalry',c:[125,100,250],pop:4,t:22,a:130,d:30,carry:80,sp:.9,b:'stable'},
 noble:{n:'Nobleman',c:[500,550,500],pop:6,t:30,a:30,d:100,carry:0,sp:.28,b:'academy'}
};
const B={
 hq:{n:'Headquarters',c:[90,80,70],t:12,max:20},
 timber:{n:'Timber Camp',c:[50,60,40],t:8,max:25,r:'w'},
 clay:{n:'Clay Pit',c:[65,50,40],t:8,max:25,r:'c'},
 iron:{n:'Iron Mine',c:[75,65,70],t:8,max:25,r:'i'},
 warehouse:{n:'Warehouse',c:[60,50,40],t:9,max:20},
 farm:{n:'Farm',c:[80,100,70],t:10,max:20},
 barracks:{n:'Barracks',c:[200,170,90],t:18,max:15,req:{hq:2}},
 stable:{n:'Stable',c:[270,240,260],t:30,max:10,req:{barracks:2}},
 wall:{n:'Wall',c:[50,100,20],t:14,max:15},
 academy:{n:'Academy',c:[600,700,600],t:60,max:1,req:{hq:5,barracks:3}}
};
let S=null,cur=0,speed=1,paused=false,selId=null,tab='build',openRep=null,running=false;
const draft={send:{},train:{}};

const V=id=>S.vs[id];
const cost=(k,L)=>B[k].c.map(x=>Math.round(x*Math.pow(1.26,L-1)));
const btime=(v,k,L)=>Math.max(3,B[k].t*Math.pow(1.2,L-1)*Math.pow(.93,v.b.hq-1));
const prodAt=L=>L<=0?.4:1.9*Math.pow(1.17,L-1);
const wcap=v=>Math.round(1000*Math.pow(1.23,v.b.warehouse-1));
const fcap=v=>Math.round(130*Math.pow(1.22,v.b.farm));
const utime=(v,u)=>U[u].t*Math.pow(.93,v.b[U[u].b]-1);
const mult=v=>v.owner>0?DIFF[S.diff].mult:v.owner===0?1:.6;
const rate=(v,r)=>prodAt(v.b[{w:'timber',c:'clay',i:'iron'}[r]])*mult(v);
const unitsPop=us=>Object.entries(us).reduce((s,[u,n])=>s+U[u].pop*n,0);
const sumN=us=>Object.values(us).reduce((s,n)=>s+n,0);
const attPower=us=>Object.entries(us).reduce((s,[u,n])=>s+U[u].a*n,0);
const defPower=(v,tr=v.troops)=>Object.entries(tr).reduce((s,[u,n])=>s+U[u].d*n,0)*(1+.07*v.b.wall)+15+5*v.b.wall;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const afford=(v,c)=>v.res.w>=c[0]&&v.res.c>=c[1]&&v.res.i>=c[2];
const pay=(v,c)=>{v.res.w-=c[0];v.res.c-=c[1];v.res.i-=c[2]};
const pts=v=>Object.values(v.b).reduce((s,n)=>s+n,0)*10;
const lordOf=o=>o>=0?S.lords[o]:{name:'Barbarians',color:BARB};
const fmt=n=>n>=10000?(n/1000).toFixed(1)+'k':Math.floor(n).toLocaleString('en');
const tm=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function popUsed(v){let p=unitsPop(v.troops);for(const q of Object.values(v.tq))for(const it of q)p+=U[it.u].pop*it.n;for(const m of S.moves)if(m.home===v.id)p+=unitsPop(m.units);return p}
function travel(a,b,us){let sp=9,any=false;for(const u in us)if(us[u]>0){any=true;sp=Math.min(sp,U[u].sp)}if(!any)sp=.7;return Math.max(1,dist(a,b))/sp}

function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;const box=$('#toasts');box.appendChild(el);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>el.remove(),5000)}

function mkVillage(p,owner,lvl,name){
 const b={hq:1,timber:1,clay:1,iron:1,warehouse:1,farm:1,barracks:0,stable:0,wall:0,academy:0};
 const v={id:S.vs.length,name,x:p.x,y:p.y,owner,b,res:{w:0,c:0,i:0},troops:{},bq:[],tq:{barracks:[],stable:[],academy:[]},loyalty:100,lvl:lvl||0,bt:rnd(4,12),aiT:rnd(1,4),atkT:rnd(50,90)};
 if(owner===0){b.timber=b.clay=b.iron=2;b.barracks=1;v.res={w:500,c:500,i:450};v.troops={spear:8,axe:10}}
 else if(owner>0){b.timber=b.clay=b.iron=S.diff===0?2:3;b.hq=2;b.warehouse=2;b.farm=2;b.wall=1;b.barracks=1;v.res={w:400,c:400,i:350};v.troops={spear:10,axe:6}}
 else{const L=lvl,j=()=>ri(-1,1);b.timber=Math.max(1,Math.round(1+L*1.2)+j());b.clay=Math.max(1,Math.round(1+L*1.2)+j());b.iron=Math.max(1,Math.round(1+L*1.2)+j());b.warehouse=2+Math.ceil(L/2);b.wall=Math.max(0,Math.floor(L/2)+j());b.hq=2+Math.floor(L/2);b.farm=2+L;b.barracks=L>=2?1+Math.floor(L/3):0;b.stable=L>=4?1:0;
  const n=2+L*5;v.troops={spear:Math.round(n*.7),sword:Math.round(n*.3)};const cp=wcap(v);v.res={w:rnd(.2,.7)*cp,c:rnd(.2,.7)*cp,i:rnd(.2,.7)*cp}}
 S.vs.push(v);return v}

function newGame(d){
 const names=shuffle([...NAMES]);
 S={v:1,t:0,diff:d,lords:LORDS.map((l,i)=>({id:i,...l,alive:true})),vs:[],moves:[],reports:[],intel:{},nid:1,over:null,stats:{raids:0,taken:0,lost:0}};
 const spots=[];const free=(x,y,m)=>spots.every(s=>Math.hypot(s.x-x,s.y-y)>=m);
 const place=(m,x0,x1,y0,y1)=>{for(let k=0;k<600;k++){const x=ri(x0,x1),y=ri(y0,y1);if(free(x,y,m)){spots.push({x,y});return{x,y}}}return null};
 const hp=place(3,10,15,10,15);mkVillage(hp,0,0,names.pop());
 [[2,6,2,6],[19,23,2,6],[2,6,19,23],[19,23,19,23]].forEach((q,i)=>mkVillage(place(3,...q),i+1,0,names.pop()));
 for(let k=0;k<26;k++){const p=place(2.2,1,MAP-2,1,MAP-2);if(!p)continue;
  const L=Math.max(1,Math.min(6,Math.round(dist(p,hp)/3.6+rnd(-.8,.8))));mkVillage(p,-1,L,names.pop()||'Ruin '+k)}
 cur=0;selId=null;openRep=null;tab='build'}

function canBuild(v,k){const L=v.b[k]+v.bq.filter(q=>q.k===k).length+1;if(L>B[k].max)return'Max level';const rq=B[k].req;if(rq)for(const r in rq)if(v.b[r]<rq[r])return`Needs ${B[r].n} ${rq[r]}`;return null}
function enqueueBuild(v,k,max=2){if(v.bq.length>=max)return'Queue full';const e=canBuild(v,k);if(e)return e;const L=v.b[k]+v.bq.filter(q=>q.k===k).length+1;const c=cost(k,L);if(!afford(v,c))return'Not enough resources';pay(v,c);const t=btime(v,k,L);v.bq.push({k,L,t,tot:t});return null}
function enqueueTrain(v,u,n){n=Math.floor(n);if(!(n>=1))return'Enter a number';const bk=U[u].b;if(v.b[bk]<1)return'Needs '+B[bk].n;const q=v.tq[bk];if(q.length>=4)return'Queue full';const c=U[u].c.map(x=>x*n);if(!afford(v,c))return'Not enough resources';if(popUsed(v)+U[u].pop*n>fcap(v))return'Farm is full';pay(v,c);q.push({u,n,t:utime(v,u)});return null}

function simVillage(v,dt){
 const cp=wcap(v);
 for(const r of RES)if(v.res[r]<cp)v.res[r]=Math.min(cp,v.res[r]+rate(v,r)*dt);
 if(v.bq.length){const q=v.bq[0];q.t-=dt;if(q.t<=0){v.b[q.k]=q.L;v.bq.shift();if(v.owner===0)toast(`${B[q.k].n} is now level ${q.L} in ${v.name}`,'good')}}
 for(const bk in v.tq){const q=v.tq[bk];if(!q.length)continue;const it=q[0];it.t-=dt;
  while(it.t<=0&&it.n>0){v.troops[it.u]=(v.troops[it.u]||0)+1;it.n--;it.t+=utime(v,it.u)}
  if(it.n<=0){q.shift();if(v.owner===0)toast(`${U[it.u].n} training finished in ${v.name}`,'good')}}
 if(v.loyalty<100)v.loyalty=Math.min(100,v.loyalty+.04*dt);
 if(v.owner===-1){v.bt-=dt;if(v.bt<=0){v.bt=rnd(9,16);const cap=(6+v.lvl*8)*(1+Math.min(S.t,1800)/1200);if(unitsPop(v.troops)<cap){const u=Math.random()<.6?'spear':'sword';v.troops[u]=(v.troops[u]||0)+1}}}
}

const clean=us=>{const o={};for(const u in us)if(us[u]>0)o[u]=us[u];return o};
const sub=(a,b)=>{const o={};for(const u in a){const d=a[u]-(b[u]||0);if(d>0)o[u]=d}return o};

function sendMove(from,to,units,kind){
 const us=clean(units);
 S.moves.push({id:S.nid++,kind:kind||'atk',owner:from.owner,home:kind==='ret'?to.id:from.id,from:from.id,to:to.id,units:us,loot:null,t0:S.t,arr:S.t+travel(from,to,us)});
}
function launch(from,to,units){
 const us=clean(units);if(!sumN(us))return false;
 for(const u in us)if((from.troops[u]||0)<us[u])return false;
 for(const u in us){from.troops[u]-=us[u];if(!from.troops[u])delete from.troops[u]}
 sendMove(from,to,us,'atk');return true}

function transfer(from,to,units,cg){
 const us=clean(units);
 for(const u in us)if((from.troops[u]||0)<us[u])return false;
 for(const r of RES)if(from.res[r]<cg[r])return false;
 if(!sumN(us)&&!(cg.w+cg.c+cg.i))return false;
 for(const u in us){from.troops[u]-=us[u];if(!from.troops[u])delete from.troops[u]}
 for(const r of RES)from.res[r]-=cg[r];
 S.moves.push({id:S.nid++,kind:'send',owner:from.owner,home:from.id,from:from.id,to:to.id,units:us,loot:{...cg},t0:S.t,arr:S.t+travel(from,to,us)});
 return true}
function capture(T,lord){
 const old=T.owner;T.owner=lord;T.loyalty=35;T.shield=S.t+120;T.troops={};T.bq=[];T.tq={barracks:[],stable:[],academy:[]};
 for(const k in T.b){const L=T.b[k],min=['hq','farm','warehouse','timber','clay','iron'].includes(k)?1:0;T.b[k]=k==='academy'?0:Math.max(min,L<=2?L:Math.round(L*.8))}
 T.aiT=rnd(2,5);T.atkT=rnd(40,80);
 if(lord===0){S.stats.taken++;toast(`${T.name} is yours. Loyalty restarts at 35 and is protected for 2 minutes.`,'good')}
 if(old===0){S.stats.lost++;toast(`${T.name} has fallen to ${lordOf(lord).name}.`,'bad')}
 checkEnd()}
function checkEnd(){
 const cnt=l=>S.vs.filter(v=>v.owner===l).length;
 S.lords.forEach(l=>{l.alive=cnt(l.id)>0});
 if(!S.over){if(!cnt(0))S.over='lose';else if(S.lords.slice(1).every(l=>!l.alive))S.over='win'}}

function arrive(m){
 const T=V(m.to),H=V(m.home);
 if(m.kind==='ret'){
  if(T.owner===m.owner){
   for(const u in m.units)T.troops[u]=(T.troops[u]||0)+m.units[u];
   if(m.loot){for(const r of RES)T.res[r]=Math.min(Math.max(T.res[r],wcap(T)),T.res[r]+m.loot[r]);
    const tot=m.loot.w+m.loot.c+m.loot.i;if(m.owner===0&&tot>0)toast(`Troops are back at ${T.name} with ${fmt(tot)} loot`,'good')}}
  return}
 if(m.kind==='send'){
  if(T.owner===m.owner){
   for(const u in m.units)T.troops[u]=(T.troops[u]||0)+m.units[u];
   if(m.loot)for(const r of RES)T.res[r]=Math.min(Math.max(T.res[r],wcap(T)),T.res[r]+m.loot[r]);
   if(m.owner===0)toast(`Delivery arrived at ${T.name}`,'good')}
  else S.moves.push({id:S.nid++,kind:'ret',owner:m.owner,home:H.id,from:T.id,to:H.id,units:m.units,loot:m.loot,t0:S.t,arr:S.t+travel(T,H,m.units)});
  return}
 if(T.owner===m.owner){for(const u in m.units)T.troops[u]=(T.troops[u]||0)+m.units[u];return}
 const us=m.units,sc=us.scout||0,atkLord=m.owner,defLord=T.owner;
 const A=attPower(us),D=defPower(T);
 const surv={...us},defLoss={};let win=false;
 if(A>0){
  let la,ld;
  if(A>D){win=true;ld=1;la=Math.pow(D/A,1.5)}else{la=1;ld=Math.pow(A/D,1.5)}
  for(const u in us)surv[u]=la>=1?0:Math.round(us[u]*(1-la));
  for(const u in T.troops){const k=Math.round(T.troops[u]*ld);if(k>0)defLoss[u]=k;T.troops[u]-=k;if(T.troops[u]<=0)delete T.troops[u]}
 }else{const sl=Math.min(.9,(T.troops.scout||0)/(sc*2));surv.scout=Math.round(sc*(1-sl))}
 const lostA=sub(us,surv);
 let loot=null;
 if(win){let carry=0;for(const u in surv)carry+=U[u].carry*surv[u];loot={w:0,c:0,i:0};
  for(let p=0;p<4;p++){const open=RES.filter(r=>T.res[r]>=1);if(!open.length||carry<1)break;const share=carry/open.length;for(const r of open){const take=Math.min(T.res[r],share);T.res[r]-=take;loot[r]+=take;carry-=take}}
  for(const r of RES)loot[r]=Math.floor(loot[r]);
  if(surv.axe>0)T.b.wall=Math.max(0,T.b.wall-(A>2*D?2:1));
  if(atkLord===0)S.stats.raids++}
 let loy=null,captured=false,nobSpent=0,shielded=false;
 if(win&&surv.noble>0&&T.shield>S.t)shielded=true;
 else if(win&&surv.noble>0){let drop=0;for(let i=0;i<surv.noble;i++)drop+=rnd(18,28);const f=T.loyalty;T.loyalty=Math.max(0,T.loyalty-drop);loy=[Math.round(f),Math.round(T.loyalty)];nobSpent=surv.noble;surv.noble=0;captured=T.loyalty<=0}
 let intel=null;
 if(atkLord===0&&(surv.scout||0)>0){intel={t:S.t,troops:{...T.troops},res:{w:Math.round(T.res.w),c:Math.round(T.res.c),i:Math.round(T.res.i)},b:{...T.b},loyalty:Math.round(T.loyalty)};S.intel[T.id]=intel}
 if(!captured&&sumN(clean(surv))>0){const left=clean(surv);S.moves.push({id:S.nid++,kind:'ret',owner:atkLord,home:H.id,from:T.id,to:H.id,units:left,loot,t0:S.t,arr:S.t+travel(T,H,left)})}
 if(atkLord===0||defLord===0){
  S.reports.unshift({id:S.nid++,t:S.t,read:false,atk:atkLord,def:defLord,from:H.name,to:T.name,win,A:Math.round(A),D:Math.round(D),sent:us,lost:lostA,defLoss,loot,loy,captured,intel,nobSpent,shielded,garrison:captured&&sumN(clean(surv))>0,scoutOnly:A===0});
  S.reports.length=Math.min(S.reports.length,40);
  if(atkLord===0&&nobSpent)toast(`${nobSpent} nobleman spent at ${T.name}: loyalty ${loy[0]} to ${loy[1]}`,'good');
  if(defLord===0)toast(`${T.name} was attacked by ${lordOf(atkLord).name}: ${win?'defense broke':'attack repelled'}`,win?'bad':'good');
  else toast(`${win?'Victory':A===0?'Scouting done':'Defeat'} at ${T.name}. See Reports.`,win?'good':'');
 }
 if(captured){
  const left=clean(surv);capture(T,atkLord);
  for(const u in left)T.troops[u]=(T.troops[u]||0)+left[u];
  if(loot)for(const r of RES)T.res[r]=Math.min(Math.max(T.res[r],wcap(T)),T.res[r]+loot[r]);
  if(atkLord===0&&sumN(left))toast(`${sumN(left)} surviving troops now garrison ${T.name}`,'good')}
}

/* ---------- rival lords ---------- */
function aiPlan(v){
 const L=S.lords[v.owner],t=S.t;
 const want=k=>{switch(k){
  case'hq':return Math.min(10,1+Math.floor(t/100));
  case'timber':case'clay':case'iron':return Math.min(10,2+Math.floor(t/60));
  case'warehouse':return Math.min(12,1+Math.floor(t/220));
  case'farm':return Math.min(14,1+Math.floor(t/150));
  case'barracks':return Math.min(8,1+Math.floor(t/100));
  case'stable':return t>300?Math.min(5,Math.floor(t/300)):0;
  case'wall':return Math.min(L.p==='builder'?12:8,Math.floor(t/140));
  case'academy':return(L.p==='warlord'?t>400:t>700)?1:0}return 0};
 let wanted=false,pri2=[];
 {
  const cp=wcap(v);let pri=[];
  if(RES.some(r=>v.res[r]>cp*.9))pri.push('warehouse');
  if(popUsed(v)>fcap(v)*.8)pri.push('farm');
  pri=pri.concat(Object.keys(B).filter(k=>v.b[k]<want(k)).sort((a,b)=>(v.b[a]+.5)/want(a)-(a==='academy'?1:0)-((v.b[b]+.5)/want(b)-(b==='academy'?1:0))+rnd(-.08,.08)));
  pri2=pri;wanted=pri.some(k=>!canBuild(v,k));
  if(v.bq.length<1){for(const k of pri){if(canBuild(v,k))continue;if(!enqueueBuild(v,k,1))wanted=false;break}}else wanted=false;
 }
 if(wanted&&Math.random()<.5)return;
 if(v.b.barracks>0){
  const room=fcap(v)-popUsed(v);
  let rsv=[0,0,0];
  if(v.b.academy>0&&(v.troops.noble||0)+v.tq.academy.reduce((s,q)=>s+q.n,0)<3&&v.tq.academy.length<1){if(enqueueTrain(v,'noble',1))rsv=[...U.noble.c]}
  else if(!v.bq.length)for(const k of pri2){if(!canBuild(v,k)){rsv=cost(k,v.b[k]+v.bq.filter(q=>q.k===k).length+1);break}}
  const kinds=L.p==='builder'?['spear','sword','axe','axe','cav']:L.p==='raider'?['axe','axe','axe','axe','cav','spear']:['axe','axe','axe','spear','sword','cav'];
  const u=pick(kinds),bk=U[u].b;
  if(v.b[bk]>0&&v.tq[bk].length<2){
   let n=Math.min(ri(4,10)+Math.floor(t/150),Math.floor(room/U[u].pop));
   for(let j=0;j<3;j++)n=Math.min(n,Math.floor((v.res[RES[j]]-rsv[j])/U[u].c[j]));
   if(n>0)enqueueTrain(v,u,n)}
 }
}
function aiAttack(v){
 const L=S.lords[v.owner],d=DIFF[S.diff];
 if(S.t<90||v.b.barracks<2&&S.t<d.grace)return;
 const off={};for(const u of['axe','cav'])if(v.troops[u])off[u]=v.troops[u];
 const power=attPower(off);if(power<60)return;
 v.know=v.know||{};
 const maxD=Math.min(34,12+S.t/60),cands=[];
 for(const T of S.vs){
  if(T.owner===v.owner)continue;
  const dd=dist(v,T);if(dd>maxD)continue;
  if(T.owner===0&&(S.t<d.grace||S.t-(L.lastHit||-1e9)<260/d.rate))continue;
  if(T.shield>S.t+30)continue;
  if(S.moves.some(m=>m.kind==='atk'&&m.owner===v.owner&&m.to===T.id))continue;
  // the lord only knows what it learned earlier; the picture is stale and imprecise
  let k=v.know[T.id];
  if(!k||S.t-k.t>k.ttl)k=v.know[T.id]={t:S.t,D:defPower(T)*rnd(.8,1.3),ttl:rnd(180,360)};
  const Dp=k.D*1.15+10;
  if(power<Dp*(v.troops.noble?2.5:T.owner===-1?1.15:1.4))continue;
  const w=(T.owner===-1?3:T.owner===0?(L.p==='raider'?.7:.4):.3)/(dd+3);
  cands.push({T,D:Dp,w})}
 if(!cands.length)return;
 let r=Math.random()*cands.reduce((s,c)=>s+c.w,0),best=cands[0];
 for(const c of cands){r-=c.w;if(r<=0){best=c;break}}
 const army={...off};
 if(v.troops.noble)army.noble=Math.min(v.troops.noble,4);
 if(launch(v,best.T,army)&&best.T.owner===0)L.lastHit=S.t;
}

function step(dt){
 S.t+=dt;
 const d=DIFF[S.diff];
 for(const v of S.vs){
  simVillage(v,dt);
  if(v.owner>0){
   v.aiT-=dt;if(v.aiT<=0){v.aiT=rnd(2.5,5);aiPlan(v)}
   v.atkT-=dt;if(v.atkT<=0){v.atkT=rnd(30,60)/d.rate;aiAttack(v)}}}
 const due=S.moves.filter(m=>m.arr<=S.t);
 if(due.length){S.moves=S.moves.filter(m=>m.arr>S.t);due.sort((a,b)=>a.arr-b.arr).forEach(arrive)}
 for(const m of S.moves)if(!m.seen&&m.kind==='atk'&&m.owner!==0&&V(m.to).owner===0){m.seen=1;toast(`Incoming attack on ${V(m.to).name} from ${V(m.from).name} (${lordOf(m.owner).name})`,'bad')}
}

 $('#clock').textContent=`Day ${Math.floor(S.t/60)+1} · ${tm(S.t%60)} · ${rivals} rival lord${rivals===1?'':'s'} left`;
 document.querySelectorAll('[data-act=speed]').forEach(b=>b.classList.toggle('on',!paused&&+b.dataset.v===speed));
 $('#bpause').classList.toggle('on',paused);$('#bpause').textContent=paused?'Resume':'Pause';
 const inc=S.moves.filter(m=>m.kind==='atk'&&m.owner!==0&&V(m.to).owner===0).sort((a,b)=>a.arr-b.arr);
 const al=$('#alert');

 else al.style.display='none';
}

function renderTabs(){
 const unread=S.reports.filter(r=>!r.read).length;
 const incoming=S.moves.filter(m=>m.kind==='atk'&&m.owner!==0&&V(m.to).owner===0).length;
 const T=[['build','Buildings'],['train','Training'],['orders','Orders'+(incoming?`<i>${incoming}</i>`:'')],['reports','Reports'+(unread?`<i>${unread}</i>`:'')],['villages','Villages']];
 $('#tabs').innerHTML=T.map(([k,l])=>`<button class="tab${tab===k?' on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('');
}
const effect=(v,k)=>{const L=v.b[k];switch(k){
 case'timber':case'clay':case'iron':return`${prodAt(L).toFixed(1)}/s now, ${prodAt(L+1).toFixed(1)}/s next`;
 case'warehouse':return`Holds ${fmt(wcap(v))} of each`;
 case'farm':return`Supports ${fcap(v)} population`;
 case'hq':return`Build time x${Math.pow(.93,L-1).toFixed(2)}`;
 case'barracks':return`Spearmen, swordsmen, axemen. Speed x${Math.pow(.93,Math.max(0,L-1)).toFixed(2)}`;
 case'stable':return'Scouts and light cavalry';
 case'wall':return`Defense +${L*7}%, plus ${15+5*L} flat`;
 case'academy':return'Trains noblemen who capture villages'}return''};

function paneBuild(v){
 let h='';
 if(v.bq.length)h+='<div class="queue">'+v.bq.map((q,i)=>`<div class="qrow"><span>${B[q.k].n} to level ${q.L}</span><span class="mono">${tm(q.t)}</span><button class="x" data-act="cancelb" data-i="${i}">Cancel</button><div class="bar"><i style="width:${(1-q.t/q.tot)*100}%"></i></div></div>`).join('')+'</div>';
 for(const k in B){
  const lv=v.b[k],qn=v.bq.filter(q=>q.k===k).length,L=lv+qn+1,err=canBuild(v,k),c=L<=B[k].max?cost(k,L):null;
  const ok=!err&&c&&afford(v,c)&&v.bq.length<2;
  h+=`<div class="row"><div class="nm">${ico(k,"bi")}<b>${B[k].n}</b> <span class="lv">${lv}${qn?` +${qn}`:''}</span><small>${effect(v,k)}</small></div>
  <div>${c?`<div class="costs">${chips(c,v)}<span class="tag mono">${tm(btime(v,k,L))}</span></div>`:'<span class="tag">Fully built</span>'}${err&&c?`<span class="tag">${err}</span>`:''}</div>
  <button class="btn sm" data-act="build" data-k="${k}"${ok?'':' disabled'}>${lv===0&&!qn?'Build':'Upgrade'}</button></div>`}
 return h}

function paneTrain(v){
 let h='';const room=fcap(v)-popUsed(v);
 for(const bk of['barracks','stable','academy']){
  const q=v.tq[bk];
  h+=`<h3>${B[bk].n} <span class="lv">${v.b[bk]}</span></h3>`;
  if(v.b[bk]<1){h+=`<div class="empty">Build the ${B[bk].n.toLowerCase()} first.</div>`;continue}
  for(const u in U){if(U[u].b!==bk)continue;const d=U[u];
   const away=S.moves.filter(m=>m.home===v.id).reduce((s,m)=>s+(m.units[u]||0),0);
   let mx=Math.floor(room/d.pop);for(let j=0;j<3;j++)mx=Math.min(mx,Math.floor(v.res[RES[j]]/d.c[j]));mx=Math.max(0,mx);
   h+=`<div class="row"><div class="nm">${ico(u,"bi")}<b>${d.n}</b> <span class="lv">${v.troops[u]||0}</span>${away?`<small>${away} away</small>`:''}${u==='noble'?'<small>Spent when it lowers a village\'s loyalty</small>':''}<div class="stats"><span>ATK ${d.a}</span><span>DEF ${d.d}</span><span>Carry ${d.carry}</span><span>${d.sp} t/s</span><span>Pop ${d.pop}</span></div></div>
   <div class="costs">${chips(d.c,v)}<span class="tag mono">${Math.round(utime(v,u))}s each</span></div>
   <div class="qty"><input type="number" min="0" id="tr_${u}" data-draft="train.${u}" value="${draft.train[u]||''}" placeholder="0" aria-label="${d.n} quantity"><button class="btn ghost sm" data-act="trmax" data-u="${u}" data-n="${mx}">Max</button><button class="btn sm" data-act="train" data-u="${u}">Train</button></div></div>`}
  if(q.length)h+='<div class="queue">'+q.map(it=>`<div class="qrow"><span>${it.n} x ${U[it.u].n}</span><span class="mono">${tm(it.t)} next</span><span></span></div>`).join('')+'</div>'}
 return h}

function paneOrders(v){
 const mine=S.moves.filter(m=>m.owner===0||V(m.to).owner===0).sort((a,b)=>a.arr-b.arr);
 if(!mine.length)return'<div class="empty">No troops are moving. Pick a village on the map to send an attack, a raid or a scout.</div>';
 return mine.map(m=>{const inc=m.owner!==0,k=m.kind==='ret'?'Returning':m.kind==='send'?'Sending':inc?'Incoming attack':'Attack';
  return`<div class="row"><div class="nm"><b style="color:${inc?'var(--bad)':'var(--ink)'}">${k}</b><small>${V(m.from).name} to ${V(m.to).name}${inc?' ('+lordOf(m.owner).name+')':''}</small></div>
  <div><div class="stats"><span>${inc?Math.round(attPower(m.units))+' attack power':unitList(m.units)}${m.loot&&m.loot.w+m.loot.c+m.loot.i>0?(m.kind==='send'?' · cargo ':' · loot ')+fmt(m.loot.w+m.loot.c+m.loot.i):''}</span></div><div class="bar"><i style="width:${Math.min(100,(S.t-m.t0)/(m.arr-m.t0)*100)}%"></i></div></div>
  <span class="mono">${tm(m.arr-S.t)}</span></div>`}).join('')}

function repTitle(r){
 if(r.scoutOnly)return['neu',`Scouted ${r.to}`];
 if(r.atk===0)return r.captured?['win',`Conquered ${r.to}`]:r.win?['win',`Victory at ${r.to}`]:['loss',`Defeat at ${r.to}`];
 return r.win?['loss',`${r.to} was hit by ${lordOf(r.atk).name}`]:['win',`Repelled ${lordOf(r.atk).name} at ${r.to}`]}
function paneReports(){
 if(!S.reports.length)return'<div class="empty">No battles yet.</div>';

  let b='';

  ${r.scoutOnly?'':`<div>Attack power <b>${r.A}</b> against defense <b>${r.D}</b></div>`}

  ${r.loot?`<div>Loot: <span class="w">${fmt(r.loot.w)}</span> <span class="c">${fmt(r.loot.c)}</span> <span class="i">${fmt(r.loot.i)}</span></div>`:''}
  ${r.nobSpent?`<div>Noblemen: <b>${r.nobSpent}</b> spent lowering loyalty${r.lost.noble?`, <b>${r.lost.noble}</b> fell in battle`:''}</div>`:r.lost.noble?`<div>Noblemen: <b>${r.lost.noble}</b> fell in battle</div>`:''}
  ${r.shielded?'<div>The village was newly taken, so its loyalty is protected. The noblemen turn back.</div>':''}${r.garrison?'<div>The surviving troops now garrison the captured village.</div>':''}
  ${r.loy?`<div>Loyalty fell from <b>${r.loy[0]}</b> to <b>${r.loy[1]}</b>${r.captured?'. The village changed hands.':''}</div>`:''}
  ${r.intel?`<div>Scouts saw: ${unitList(r.intel.troops)}. Stores <span class="w">${fmt(r.intel.res.w)}</span> <span class="c">${fmt(r.intel.res.c)}</span> <span class="i">${fmt(r.intel.res.i)}</span>. Wall ${r.intel.b.wall}.</div>`:''}</div>`}
  return`<div class="rep${r.read?'':' unread'}"><div class="hd" data-act="rep" data-id="${r.id}"><span><b class="${c}">${t}</b></span><span class="tag mono">${tm(S.t-r.t)} ago</span></div>${b}</div>`}).join('')}

function paneVillages(){
 return S.vs.filter(v=>v.owner===0).map(v=>`<div class="row"><div class="nm"><b>${v.name}</b> <span class="lv">${pts(v)}</span><small>(${v.x}, ${v.y}) · loyalty ${Math.round(v.loyalty)}</small></div>
 <div class="stats"><span>Wood ${fmt(v.res.w)}</span><span>Clay ${fmt(v.res.c)}</span><span>Iron ${fmt(v.res.i)}</span><span>${unitList(v.troops)}</span></div>
 <button class="btn sm${v.id===cur?' ghost':''}" data-act="goto" data-id="${v.id}"${v.id===cur?' disabled':''}>${v.id===cur?'Viewing':'Open'}</button></div>`).join('')}

function renderPanel(force){

 if(!force&&p.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;

/* ---------- target dossier ---------- */
function sendTotals(v,T){const us={};for(const u in U){const n=Math.min(v.troops[u]||0,Math.max(0,Math.floor(+draft.send[u]||0)));if(n>0)us[u]=n}return us}
function updSend(){
 const v=curV(),T=selId!=null?V(selId):null,el=$('#sendinfo');if(!el||!T)return;
 const us=sendTotals(v,T),it=S.intel[T.id];
 if(T.owner===0){const cg=RES.reduce((s,r)=>s+Math.min(Math.floor(v.res[r]),Math.max(0,Math.floor(+draft.send['r'+r]||0))),0);
  el.textContent=sumN(us)||cg?`Travel ${tm(travel(v,T,us))}${sumN(us)?'':' (carts, slower than troops)'} · ${sumN(us)} troops, ${fmt(cg)} resources`:'Choose troops or resources to send.';return}
 if(!sumN(us)){el.textContent='Choose troops to send.';return}
 let s=`Travel ${tm(travel(v,T,us))} · attack power ${Math.round(attPower(us))}`;
 if(it)s+=` · scouted defense ${Math.round(defPower(T,it.troops))}`;
 if(us.noble)s+=' · noblemen are spent when they lower loyalty';
 el.textContent=s}
function troopInputs(v){
 let h='';
 for(const u in U){const n=v.troops[u]||0;if(!n)continue;
  h+=`<label><span>${ico(u)} ${U[u].n} (${n})</span><span class="in"><input type="number" min="0" max="${n}" id="sd_${u}" data-draft="send.${u}" value="${draft.send[u]||''}" placeholder="0"><button class="btn ghost sm" data-act="sdall" data-u="${u}" data-n="${n}">All</button></span></label>`}
 if(!h)h='<span class="tag">No troops at home.</span>';
 return h}
function resInputs(v){
 const nm={w:'Wood',c:'Clay',i:'Iron'};
 return RES.map(r=>{const n=Math.floor(v.res[r]);return`<label><span class="${r}">${nm[r]} (${fmt(n)})</span><span class="in"><input type="number" min="0" max="${n}" id="sr_${r}" data-draft="send.r${r}" value="${draft.send['r'+r]||''}" placeholder="0"><button class="btn ghost sm" data-act="srall" data-r="${r}" data-n="${n}">All</button></span></label>`}).join('')}
function renderTarget(force){
 const box=$('#target'),v=curV();
 if(!force&&box.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'){updSend();return}
 if(selId==null||!V(selId)){setH(box,'<div class="empty" style="padding:4px 0">Tap a village on the map to see it and send troops. Gold squares are yours, coloured ones belong to rival lords, grey ones are barbarians.</div>');return}
 const T=V(selId),l=lordOf(T.owner),d=dist(v,T),it=S.intel[T.id];
 let h=`<h2>${T.name}${ownTag(T.owner)}</h2><div class="kv"><span>Position <b>(${T.x}, ${T.y})</b></span><span>Distance <b>${d.toFixed(1)}</b></span><span>Size <b>${pts(T)}</b></span><span>Loyalty <b>${Math.round(T.loyalty)}</b></span>${T.shield>S.t?`<span>Loyalty protected <b>${tm(T.shield-S.t)}</b></span>`:''}</div>`;
 if(T.owner===0){
  h+=`<div class="ctl"><button class="btn" data-act="goto" data-id="${T.id}"${T.id===cur?' disabled':''}>${T.id===cur?'Currently managing':'Manage this village'}</button></div>`;
  if(T.id!==cur)h+=`<h3>Send from ${v.name}</h3><div class="send">${troopInputs(v)}${resInputs(v)}</div><div class="tag mono" id="sendinfo"></div><div class="ctl" style="margin-top:8px"><button class="btn" data-act="transfer">Send to ${T.name}</button><button class="btn ghost" data-act="clr">Clear</button></div>`;
  setH(box,h);if(T.id!==cur)updSend();return}
 h+=it?`<div class="intel">Scouted ${tm(S.t-it.t)} ago. Troops: ${unitList(it.troops)}. Stores <span class="w">${fmt(it.res.w)}</span> <span class="c">${fmt(it.res.c)}</span> <span class="i">${fmt(it.res.i)}</span>. Wall ${it.b.wall}. Defense about <b class="mono">${Math.round(defPower(T,it.troops))}</b>.</div>`:`<div class="intel">Not scouted. Send a scout, or a few troops, to learn its defense.</div>`;
 h+='<div class="send">'+troopInputs(v)+`</div><div class="tag mono" id="sendinfo"></div><div class="ctl" style="margin-top:8px"><button class="btn" data-act="attack">Send attack</button><button class="btn ghost" data-act="scout1"${v.troops.scout?'':' disabled'}>Scout with 1</button><button class="btn ghost" data-act="alloff">Fill all offense</button><button class="btn ghost" data-act="clr">Clear</button></div>`;
 setH(box,h);updSend()}

/* ---------- map ---------- */
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295};
function drawMap(){
 const cv=$('#map'),w=cv.parentElement.clientWidth;if(!w||!S)return;
 const dpr=window.devicePixelRatio||1;
 if(cv.width!==Math.round(w*dpr)){cv.width=cv.height=Math.round(w*dpr);cv.style.height=w+'px'}
 const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const cs=w/MAP;
 for(let x=0;x<MAP;x++)for(let y=0;y<MAP;y++){const n=hash(x,y);g.fillStyle=`hsl(${135+n*25},${16+n*10}%,${8+n*5}%)`;g.fillRect(x*cs,y*cs,cs+.5,cs+.5)}
 g.strokeStyle='rgba(255,255,255,.04)';g.lineWidth=1;g.beginPath();for(let i=0;i<=MAP;i+=1){g.moveTo(i*cs,0);g.lineTo(i*cs,w);g.moveTo(0,i*cs);g.lineTo(w,i*cs)}g.stroke();
 const P=(v)=>[(v.x+.5)*cs,(v.y+.5)*cs];
 for(const m of S.moves){const a=P(V(m.from)),b=P(V(m.to));const inc=m.owner!==0&&V(m.to).owner===0;
  const col=inc?'#ea684f':m.owner===0?'#e3b04b':lordOf(m.owner).color;
  g.strokeStyle=col;g.globalAlpha=m.kind==='ret'?.25:.55;g.setLineDash([4,4]);g.lineWidth=inc?2:1;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  const f=Math.min(1,Math.max(0,(S.t-m.t0)/(m.arr-m.t0)));g.fillStyle=col;g.beginPath();g.arc(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,Math.max(2.5,cs*.17),0,7);g.fill()}
 for(const v of S.vs){const[px,py]=P(v),l=lordOf(v.owner),r=cs*(.2+Math.min(.14,pts(v)/1400));
  if(v.owner===-1){g.strokeStyle=BARB;g.lineWidth=1.5;g.strokeRect(px-r,py-r,r*2,r*2);g.fillStyle='rgba(139,145,141,.25)';g.fillRect(px-r,py-r,r*2,r*2)}
  else{g.fillStyle=l.color;g.fillRect(px-r,py-r,r*2,r*2);g.fillStyle='rgba(10,14,16,.7)';g.fillRect(px-r*.45,py-r*.45,r*.9,r*.9)}
  if(v.owner===0&&v.id===cur){g.strokeStyle='#e3b04b';g.lineWidth=1.5;g.beginPath();g.arc(px,py,r*1.9,0,7);g.stroke()}
  if(v.id===selId){g.strokeStyle='#e8e4d6';g.setLineDash([3,3]);g.lineWidth=1.5;g.strokeRect(px-r*1.5,py-r*1.5,r*3,r*3);g.setLineDash([])}
  if(v.owner===0||v.id===selId){g.fillStyle='#e8e4d6';g.font=`${Math.max(10,cs*.38)}px system-ui,sans-serif`;g.textAlign='center';g.fillText(v.name,px,py-r*2.1)}}
}

const cache=new WeakMap();
function setH(el,h){if(cache.get(el)!==h){cache.set(el,h);el.innerHTML=h}}
let ptr=false;
document.addEventListener('pointerdown',()=>{ptr=true});
['pointerup','pointercancel'].forEach(e=>document.addEventListener(e,()=>{setTimeout(()=>{ptr=false},60)}));

function overlay(mode){
 const o=$('#overlay'),c=$('#card');
 const has=(()=>{try{return!!localStorage.getItem(SAVE)}catch(e){return false}})();
 const how=`<ul><li>Upgrade mines and the warehouse first, then the barracks. Everything runs fast: a level takes seconds.</li><li>Raid barbarian villages for loot. Farther ones are stronger. Send a scout before you commit troops.</li><li>Rival lords build up, raid barbarians and each other, and will come for you once the grace period ends (10 minutes on Easy, 7 on Normal, 5 on Hard).</li><li>Build the Academy, train noblemen and send them behind a clearing attack. Each surviving nobleman cuts about 23 loyalty, and loyalty heals slowly (about 2 per minute). At zero the village is yours.</li><li>The army that breaks a village's loyalty stays there as its garrison, and the village is protected for 2 minutes.</li><li>Select one of your other villages on the map to send it troops and resources.</li><li>Win by taking every village from all four rival lords.</li></ul>`;
 if(mode==='over'){
  const win=S.over==='win';
  c.innerHTML=`<h1>${win?'The march is yours':'Your banner has fallen'}</h1><p>${win?'Every rival lord has lost their holdings.':'You lost your last village.'} Time ${tm(S.t)}, villages taken ${S.stats.taken}, raids won ${S.stats.raids}, villages lost ${S.stats.lost}.</p><div class="ctl">${[0,1,2].map(i=>`<button class="btn${i===1?'':' ghost'}" data-act="new" data-v="${i}">New campaign: ${DIFF[i].n}</button>`).join('')}</div>`;
 }else{
  c.innerHTML=`<h1>Marchlands</h1><p>A solo war of villages. Grow your holdings, raid the barbarians and take the rival lords' villages with noblemen.</p>${how}
  <div class="ctl">${[0,1,2].map(i=>`<button class="btn${i===1?'':' ghost'}" data-act="new" data-v="${i}">New campaign: ${DIFF[i].n}</button>`).join('')}</div>
  ${has||running?`<div class="ctl"><button class="btn ghost" data-act="resume">${running?'Back to game':'Continue saved game'}</button></div>`:''}`;
 }
 o.classList.add('on');paused=true;
}
function startGame(d){newGame(d);begin()}
function begin(){running=true;paused=false;$('#overlay').classList.remove('on');renderAll(true)}
function renderAll(force){renderScene();renderTop();renderTabs();renderPanel(force);renderTarget(force);drawMap()}

document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.draft;if(!k)return;
 const[g,u]=k.split('.');draft[g][u]=e.target.value;if(g==='send')updSend()});

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,v=S&&curV();
 const err=m=>{if(m)toast(m,'bad');renderAll(true)};
 switch(a){
  case'new':startGame(+el.dataset.v);break;
  case'resume':if(running)begin();else if(load()){begin()}break;
  case'menu':overlay('menu');break;
  case'pause':paused=!paused;renderTop();break;
  case'speed':speed=+el.dataset.v;paused=false;renderTop();break;
  case'tab':tab=el.dataset.v;renderAll(true);break;
  case'build':err(enqueueBuild(v,el.dataset.k));break;
  case'cancelb':{const q=v.bq.splice(+el.dataset.i,1)[0];if(q)for(let j=0;j<3;j++)v.res[RES[j]]+=cost(q.k,q.L)[j];renderAll(true);break}
  case'trmax':draft.train[el.dataset.u]=el.dataset.n;renderAll(true);break;
  case'train':{const u=el.dataset.u,m=enqueueTrain(v,u,+draft.train[u]);if(!m)draft.train[u]='';err(m);break}
  case'rep':{const r=S.reports.find(x=>x.id===+el.dataset.id);if(r){r.read=true;openRep=openRep===r.id?null:r.id}renderAll(true);break}
  case'goto':cur=+el.dataset.id;selId=null;tab='build';renderAll(true);break;
  case'sdall':draft.send[el.dataset.u]=el.dataset.n;renderTarget(true);break;
  case'srall':draft.send['r'+el.dataset.r]=el.dataset.n;renderTarget(true);break;
  case'transfer':{const T=V(selId),us=sendTotals(v,T),cg={w:0,c:0,i:0};
   for(const r of RES)cg[r]=Math.min(Math.floor(v.res[r]),Math.max(0,Math.floor(+draft.send['r'+r]||0)));
   if(!sumN(us)&&!(cg.w+cg.c+cg.i)){toast('Choose troops or resources first','bad');break}
   if(transfer(v,T,us,cg)){toast(`Sent to ${T.name}, arriving in ${tm(travel(v,T,us))}`);draft.send={}}
   renderAll(true);break}
  case'clr':draft.send={};renderTarget(true);break;
  case'alloff':draft.send={};for(const u of['axe','cav'])if(v.troops[u])draft.send[u]=v.troops[u];renderTarget(true);break;
  case'scout1':{const T=V(selId);if(launch(v,T,{scout:1}))toast(`Scout sent to ${T.name}`);renderAll(true);break}
  case'attack':{const T=V(selId),us=sendTotals(v,T);
   if(!sumN(us)){toast('Choose some troops first','bad');break}
   if(launch(v,T,us)){toast(`${sumN(us)} troops march on ${T.name}, arriving in ${tm(travel(v,T,us))}`);draft.send={}}
   renderAll(true);break}
 }
});
$('#map').addEventListener('click',e=>{
 if(!S)return;const r=e.target.getBoundingClientRect(),cs=r.width/MAP;
 const x=(e.clientX-r.left)/cs-.5,y=(e.clientY-r.top)/cs-.5;
 let best=null,bd=1.1;for(const v of S.vs){const d=Math.hypot(v.x-x,v.y-y);if(d<bd){bd=d;best=v}}
 selId=best?best.id:null;renderAll(true)});

$('#legend').innerHTML=[['Your villages','#e3b04b'],...LORDS.slice(1).map(l=>[l.name,l.color]),['Barbarians',BARB]].map(([n,c])=>`<span style="--lc:${c}">${n}</span>`).join('');

let last=performance.now(),n=0,lastSave=0;
setInterval(()=>{
 const now=performance.now();let dt=Math.min(10,(now-last)/1000);last=now;
 if(!S||!running)return;
 if(!paused&&!S.over){let rem=dt*speed;while(rem>0){const s=Math.min(.5,rem);step(s);rem-=s}}
 if(S.over&&running){running=false;try{localStorage.removeItem(SAVE)}catch(e){}overlay('over');return}
 drawMap();
 if(++n%5===0&&!ptr){renderScene();renderTop();renderTabs();renderPanel();renderTarget()}
 if(now-lastSave>8000){lastSave=now;save()}
},100);
window.addEventListener('beforeunload',()=>{if(S&&running)save()});
overlay('start');
</script>
</body>
</html>
