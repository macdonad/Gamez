<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1319">
<meta name="description" content="Embermark is a single-player idle RPG of gathering, crafting, dungeons, guilds and raids. It saves in your browser and runs offline.">
<title>Embermark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e1319'/%3E%3Cpath d='M32 8l6 22h-12zM29 30h6v18h-6zM22 46h20v5H22z' fill='%23cba24f'/%3E%3C/svg%3E">
<style>
/* Layout: sticky header + activity strip, left rail nav on desktop (scrolling tab row on phones), card grids in the main pane, event log pinned under content. */
:root{
  --bg:#0e1319; --panel:#161e27; --panel2:#1d2732; --line:#2b3745;
  --ink:#e8e2d2; --mute:#8f9aa6; --brass:#cba24f; --brass-d:#8d6e2c;
  --hp:#b9473e; --xp:#4a8f86; --foe:#8e5aa8; --good:#6fae6a; --warn:#d09a3a;
  --disp:Georgia,"Times New Roman",serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px 10px}
header h1{font-size:1.5rem;color:var(--brass)}
header h1 small{display:block;font:500 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hud{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.hud .stat{display:flex;flex-direction:column;min-width:0}
.hud .lab{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hud .val{font-weight:700}
.bar{height:10px;background:#0a0e13;border:1px solid var(--line);border-radius:3px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:var(--xp);transition:width .15s linear}
.bar.hp i{background:var(--hp)}.bar.foe i{background:var(--foe)}.bar.gold i{background:var(--brass)}
.strip{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:4px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:8px 16px;align-items:center}
.strip .lbl{font-weight:700;overflow-wrap:anywhere}
.strip .bars{display:grid;gap:6px;min-width:0}
.strip .bars .row{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--mute)}
.strip .bars .bar{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-weight:700;letter-spacing:.03em}
.btn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.btn.pri{background:var(--brass);color:#1a1405;border-color:var(--brass)}
.btn.pri:hover:not(:disabled){background:#dcb560;color:#1a1405}
.btn.pri:disabled{background:var(--panel2);color:var(--mute);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:.85rem}
.shell{display:grid;grid-template-columns:168px minmax(0,1fr);gap:20px;margin-top:16px;padding-bottom:max(32px,env(safe-area-inset-bottom,0px))}
nav{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:12px}
nav button{text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:9px 12px;font-family:var(--disp);letter-spacing:.05em;color:var(--mute)}
nav button:hover{color:var(--ink);background:var(--panel)}
nav button[aria-current=true]{color:var(--brass);background:var(--panel);border-color:var(--line);border-left:3px solid var(--brass)}
main{min-width:0;display:grid;gap:16px;align-content:start}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:1.15rem;color:var(--brass)}
.sec-title p{margin:0;color:var(--mute);font-size:.9rem}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 12px;display:grid;gap:5px;min-width:128px;text-align:left}
.pill[aria-pressed=true]{border-color:var(--brass);background:var(--panel2)}
.pill b{display:flex;justify-content:space-between;gap:10px}
.pill .bar{min-width:0;height:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.card.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.card.lock{opacity:.55}
.card h3{font-size:.98rem;display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
.card h3 .ic{font-size:1.3rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);font-size:.88rem}
.meta b{color:var(--ink)}
.ok{color:var(--good)}.bad{color:var(--hp)}.warn{color:var(--warn)}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--brass-d);color:var(--brass);padding:0 6px;border-radius:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.table{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 12px}
.trow .nm{overflow-wrap:anywhere}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:4px;background:var(--panel)}
.slot .lab{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#log{background:#0a0e13;border:1px solid var(--line);border-radius:4px;padding:10px 14px;height:140px;overflow-y:auto;font-size:.9rem;color:var(--mute);display:flex;flex-direction:column;gap:2px}
#log .good{color:var(--good)}#log .warn{color:var(--warn)}#log .bad{color:var(--hp)}#log .gold{color:var(--brass)}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.82);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal .box{background:var(--panel);border:1px solid var(--brass-d);border-radius:6px;padding:22px;max-width:620px;width:100%;display:grid;gap:14px}
.modal h2{color:var(--brass)}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.classes button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:3px}
.classes button:hover{border-color:var(--brass)}
.classes b{font-family:var(--disp);color:var(--brass)}
.classes span{font-size:.85rem;color:var(--mute)}
textarea,input[type=text]{width:100%;background:#0a0e13;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px;font:inherit}
textarea{min-height:70px;font-size:.8rem}
ul.plain{margin:0;padding-left:18px}
@media (max-width:780px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px;gap:6px}
  nav button{white-space:nowrap;border:1px solid var(--line)}
  .strip{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
/* standalone page */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
#view{display:grid;gap:14px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;min-height:36px}
.chip:hover{border-color:var(--brass)}
.chip[aria-pressed=true]{background:var(--brass);color:#1a1405;border-color:var(--brass)}
.tag.ok{border-color:var(--good);color:var(--good)}
.slots{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Embermark <small>An idle chronicle of the Ashen Realms</small></h1>
    <div class="hud">
      <div class="stat"><span class="lab">Gold</span><span class="val" id="hGold">0</span></div>
      <div class="stat"><span class="lab">Combat</span><span class="val" id="hCl">1</span></div>
      <div class="stat"><span class="lab">Health</span><div class="bar hp"><i id="hHp"></i></div></div>
      <div class="stat"><span class="lab">Class</span><span class="val" id="hCls">-</span></div>
    </div>
  </header>
  <section class="strip" aria-live="off">
    <div class="lbl" id="sLbl">Idle</div>
    <div class="bars">
      <div class="row"><div class="bar" id="sB1w"><i id="sB1"></i></div><span id="sT1"></span></div>
      <div class="row" id="sR2" hidden><div class="bar hp" id="sB2w"><i id="sB2"></i></div><span id="sT2"></span></div>
    </div>
    <button class="btn" id="sStop" data-do="stop" hidden>Stop</button>
  </section>
  <div class="shell">
    <nav id="nav" aria-label="Sections"></nav>
    <main>
      <div id="view"></div>
      <div id="log" role="log" aria-label="Event log"></div>
    </main>
  </div>
</div>
<div id="modal"></div>

<script>
(()=>{
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';if(a>=1e4)return(n/1e3).toFixed(1)+'K';return n.toLocaleString();};
const rnd=(a,b)=>a+Math.random()*(b-a);
const Rd=Math.round;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- XP curve ---------- */
const XT=[0,0];{let p=0;for(let l=1;l<100;l++){p+=Math.floor(l+300*Math.pow(2,l/7));XT[l+1]=Math.floor(p/4);}}
const lvlOf=xp=>{let l=1;while(l<99&&xp>=XT[l+1])l++;return l;};
const pct=xp=>{const l=lvlOf(xp);if(l>=99)return 100;return(xp-XT[l])/(XT[l+1]-XT[l])*100;};

/* ---------- Tiers: ten steps, so there is always something new within a few levels ---------- */
const NT=10;
const TIERS=['Copper','Iron','Bronzite','Silverite','Cobalt','Aetherite','Emberite','Starsteel','Voidsteel','Sunforged'];
const LTH=['Rough','Hardened','Wolfhide','Studded','Frostwoven','Runed','Cinderhide','Drakescale','Voidscale','Wyrmhide'];
const TL=[1,8,16,25,34,43,52,62,72,85];              // level where each tier unlocks (skills and combat)
const B=[6,11,18,28,42,62,90,130,185,260];            // base gear power per tier
const VAL=[2,6,14,30,60,110,190,320,520,850];         // base sell value per tier
const range=i=>XT[i<NT-1?TL[i+1]:99]-XT[TL[i]];      // XP between this tier and the next

/* ---------- Items ---------- */
const IT={};
const mk=(name,icon,val,o={})=>{let id=slug(name);while(IT[id]){name+=' II';id=slug(name);}IT[id]={id,name,icon,val,...o};return id;};
const SLOTS=['weapon','offhand','head','chest','legs','boots','ring','amulet','trinket'];
const SLN={weapon:'Weapon',offhand:'Off-hand',head:'Head',chest:'Chest',legs:'Legs',boots:'Boots',ring:'Ring',amulet:'Amulet',trinket:'Trinket'};
const SLI={weapon:'🗡️',offhand:'🛡️',head:'⛑️',chest:'🧥',legs:'👖',boots:'🥾',ring:'💍',amulet:'📿',trinket:'🔮'};
const GS={weapon:[1,0,0],offhand:[0,.5,1.5],head:[0,.35,1.2],chest:[0,.55,2],legs:[0,.45,1.6],boots:[0,.3,1],ring:[.3,0,1],amulet:[.2,.2,1.5],trinket:[.25,.15,1.5]};
const LS={head:[.15,.2,1.2],chest:[.25,.3,2],legs:[.2,.25,1.6],boots:[.15,.15,1]};
const stats=(t,b,mult=1,crit=0)=>({atk:Rd(t[0]*b*mult),def:Rd(t[1]*b*mult),hp:Rd(t[2]*b*mult),crit});

const SK=[],ACT={};
const gather=(key,name,icon,ic,names,vm=1)=>{SK.push({key,name,icon,acts:names.map((n,i)=>{const id=mk(n,ic,Rd(VAL[i]*vm));const a={kind:'gather',skill:key,id,name:n,lvl:TL[i],sec:+(3+.4*i).toFixed(1),xp:Math.max(5,Rd(range(i)/280)),out:id,tier:i};ACT[id]=a;return a;})});};
gather('mining','Mining','⛏️','🪨',['Copper Ore','Iron Ore','Bronzite Ore','Silverite Ore','Cobalt Ore','Aetherite Ore','Emberite Ore','Starsteel Ore','Voidsteel Ore','Sunforged Ore']);
gather('herbalism','Herbalism','🌿','🌱',['Meadow Sage','Bloodthorn','Mistbloom','Frostmint','Wyrmroot','Dreamroot','Emberleaf','Sunpetal','Voidbloom','Ancient Lotus']);
gather('fishing','Fishing','🎣','🐟',['Silverfin','Lake Trout','River Pike','Gloomeel','Cavefin','Stormray','Ashcarp','Moonlit Bass','Abyssal Eel','Deepmaw Cod']);
gather('skinning','Skinning','🔪','🟫',['Rough Hide','Thick Hide','Wolfpelt','Heavy Hide','Frostpelt','Runed Hide','Cinderhide','Drake Hide','Voidscale','Wyrm Hide'],1.3);
const mat=(k,i)=>SK[k].acts[i].id;
const CK=[],AL=[],SM=[],LW=[],JC=[];
const craft=(skill,list,name,icon,val,lvl,sec,xp,inn,cat,o={})=>{const id=mk(name,icon,val,o);const a={kind:'craft',skill,id,name:IT[id].name,lvl,sec,xp,in:inn,out:id,cat};ACT[id]=a;list.push(a);return a;};
const FOODS=['Grilled Silverfin','Trout Fillet','Pike Chowder','Gloomeel Stew','Cavefin Skewer','Stormray Steak','Ashcarp Roast','Moonbass Supper','Abyssal Bisque','Deepmaw Feast'];
const FH=[25,55,95,150,230,340,500,720,1000,1400];
const POTS=['Minor Healing Draught','Healing Draught','Strong Healing Draught','Greater Healing Draught','Potent Healing Draught','Superior Healing Draught','Major Healing Draught','Grand Healing Draught','Supreme Healing Draught','Ancient Healing Draught'];
const PH=[30,70,120,190,290,430,620,900,1250,1750];
const ELX=[['Might','atk','attack'],['Ironhide','def','defense'],['Vitality','hp','health']];
const ELP=['','Greater ','Superior ','Grand ','Supreme '],ELV=[8,12,16,20,25];
const ELN={atk:'attack',def:'defense',hp:'health'};
for(let i=0;i<NT;i++){
  const r=range(i),T=TIERS[i],L=TL[i],b=B[i],v=VAL[i],s=+(3+.4*i).toFixed(1);
  const X=m=>Math.max(4,Rd(r/120*m));
  const ore=mat(0,i),herb=mat(1,i),fish=mat(2,i),hide=mat(3,i);
  CK.push(craft('cooking',[],FOODS[i],'🍲',Rd(FH[i]/4),L,3,X(1),{[fish]:1},'Meals',{heal:FH[i]}));
  AL.push(craft('alchemy',[],POTS[i],'🧪',Rd(PH[i]/3),L,3.5,X(1),{[herb]:2},'Potions',{heal:PH[i]}));
  if(i%2===1){const j=(i-1)/2;ELX.forEach(([nm,key],k)=>craft('alchemy',[],ELP[j]+'Elixir of '+nm,'⚗️',Rd(v*3),L+2+k,4,X(1.2),{[herb]:3},'Elixirs',{elix:key,pct:ELV[j]}));}
  const bar=craft('smithing',SM,T+' Bar','🔩',Rd(v*2.5),L,s,X(.4),{[ore]:2},'Bars').id;
  const sm=(nm,ic,slot,off,inn,m,cat)=>craft('smithing',SM,T+' '+nm,ic,Rd(v*6),L+off,s+1,X(m),inn,cat,{slot,...stats(GS[slot],b)});
  sm('Blade','⚔️','weapon',1,{[bar]:3},1,'Weapons');
  sm('Bulwark','🛡️','offhand',2,{[bar]:3,[hide]:1},1,'Shields');
  sm('Helm','⛑️','head',3,{[bar]:2,[hide]:1},1,'Helms');
  sm('Plate','🧥','chest',4,{[bar]:4,[hide]:2},1.4,'Chestplates');
  sm('Greaves','👖','legs',5,{[bar]:3,[hide]:1},1.2,'Leggings');
  sm('Sabatons','🥾','boots',6,{[bar]:2,[hide]:1},1,'Boots');
  const lw=(nm,ic,slot,off,n,m,cat)=>craft('leatherworking',LW,LTH[i]+' '+nm,ic,Rd(v*6),L+off,s+.5,X(m),{[hide]:n,[herb]:1},cat,{slot,...stats(LS[slot],b,1,.01)});
  lw('Cap','🧢','head',0,3,1,'Caps');
  lw('Jerkin','🥋','chest',2,5,1.4,'Jerkins');
  lw('Leggings','👖','legs',4,4,1.2,'Leggings');
  lw('Boots','🥾','boots',6,3,1,'Boots');
  craft('jewelcrafting',JC,T+' Band','💍',Rd(v*7),L+1,s+1,X(1),{[bar]:2,[herb]:1},'Rings',{slot:'ring',...stats(GS.ring,b,1,.01)});
  craft('jewelcrafting',JC,T+' Pendant','📿',Rd(v*7),L+4,s+1,X(1.2),{[bar]:3,[herb]:2},'Amulets',{slot:'amulet',...stats(GS.amulet,b)});
}
const flat=l=>l.sort((a,b)=>a.lvl-b.lvl);
SK.push({key:'cooking',name:'Cooking',icon:'🍳',acts:CK},{key:'alchemy',name:'Alchemy',icon:'⚗️',acts:flat(Object.values(ACT).filter(a=>a.skill==='alchemy'))},
  {key:'smithing',name:'Blacksmithing',icon:'🔨',acts:flat(SM)},{key:'leatherworking',name:'Leatherworking',icon:'🧵',acts:flat(LW)},{key:'jewelcrafting',name:'Jewelcrafting',icon:'💎',acts:flat(JC)});
const SKM=Object.fromEntries(SK.map(s=>[s.key,s]));

/* ---------- Rare and unique gear ---------- */
const NOUN={weapon:['Blade','Hammer','Staff','Cleaver','Axe','Spear','Scepter','Glaive'],offhand:['Aegis','Bulwark','Ward','Tome'],head:['Helm','Crown','Cowl','Visage'],chest:['Breastplate','Vestments','Hauberk','Mantle'],legs:['Greaves','Legguards','Kilt'],boots:['Treads','Striders','Sabatons'],ring:['Signet','Band','Loop'],amulet:['Pendant','Talisman','Locket'],trinket:['Idol','Relic','Totem','Sigil','Charm']};
let nn=0;
const unique=(theme,slot,t,mult,crit)=>{const l=NOUN[slot];return mk(`${theme} ${l[nn++%l.length]}`,SLI[slot],Rd(VAL[t]*mult*8),{slot,...stats(GS[slot],B[t],mult,crit),rare:1});};

/* ---------- Combat scaling: monsters are built from what a player of that level should have ---------- */
const refStat=i=>{const req=TL[i],bp=i?B[i-1]:0;return{atk:4+1.2*req+1.5*bp,def:2+.8*req+2.15*bp,hp:60+8*req+7.3*bp};};
const zoneXp=i=>Math.max(4,range(i)/200);
function genMon(name,i,s,dmgFrac,hpMul,xp,gold){const r=refStat(i),c=dmgFrac*r.hp*s,atk=(c+Math.sqrt(c*c+4*c*r.def))/2;return{name,hp:Rd(hpMul*r.atk*s),atk:Rd(atk),def:Rd(.8*r.atk*s),xp:Math.max(1,Rd(xp)),gold:Math.max(1,Rd(gold))};}
const ZD=[
 ['Greenmeadow Fields','Meadow',['Plains Wolf','Bandit Scout','Wild Boar'],'Wolf Fang'],
 ['Duskwood Thicket','Duskwood',['Gloom Stag','Thornback Bear','Hollow Witch'],'Stag Antler'],
 ['Murkwater Marsh','Marsh',['Bog Lurker','Marsh Hag','Giant Leech'],'Leech Gland'],
 ['Stonereach Hills','Stonereach',['Hill Ogre','Rockhide Ram','Gravel Imp'],'Ram Horn'],
 ['Frostmaw Pass','Frostmaw',['Rime Wolf','Ice Troll','Snow Wraith'],'Troll Tooth'],
 ['Sunscar Desert','Sunscar',['Dune Stalker','Scorpid Matriarch','Sand Revenant'],'Scorpid Stinger'],
 ['Cinderwaste','Cinder',['Ash Raider','Magma Hound','Emberwing Drake'],'Magma Core'],
 ['Shadowmire','Shademire',['Night Prowler','Gravewalker','Dusk Banshee'],'Banshee Veil'],
 ['Skyreach Peaks','Skyreach',['Storm Harpy','Cliff Giant','Thunder Roc'],'Roc Feather'],
 ['Deepmaw Abyss','Abyssal',['Tide Horror','Abyssal Brute','Void Siren'],'Siren Pearl']
];
const SCL=[.8,1,1.3];
const ZN=ZD.map((z,i)=>({id:i,name:z[0],req:TL[i],tier:i,hide:mat(3,i),
  trophy:mk(z[3],'🦴',Rd(VAL[i]*4),{trophy:1}),
  rare:[0,1,2].map(k=>unique(z[1],SLOTS[(i*3+k+4)%9],i,1.2,.015)),

/* ---------- Helpers ---------- */
const have=id=>S.inv[id]||0;
const add=(id,n=1)=>{S.inv[id]=have(id)+n;};
const rem=(id,n=1)=>{S.inv[id]=have(id)-n;if(S.inv[id]<=0)delete S.inv[id];};
const gl=()=>Math.min(29,Math.floor(Math.sqrt(S.guild.xp/40)));
const gpct=()=>{const l=gl();if(l>=29)return 100;const a=l*l*40,b=(l+1)*(l+1)*40;return(S.guild.xp-a)/(b-a)*100;};
const xpMul=()=>1+.03*S.guild.hall.library+.01*gl();
const goldMul=()=>1+.04*S.guild.hall.vault;
const speed=()=>1+.03*S.guild.hall.workshop;
const rosterCap=()=>5+2*S.guild.hall.barracks;
const logEl=$('#log');
function log(msg,cls=''){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;logEl.appendChild(d);while(logEl.children.length>60)logEl.firstChild.remove();logEl.scrollTop=logEl.scrollHeight;}
function gainXp(sk,amt){const before=lvlOf(S.xp[sk]);S.xp[sk]+=amt*xpMul();const after=lvlOf(S.xp[sk]);if(after>before){log((sk==='combat'?'Combat':SKM[sk].name)+' reached level '+after+'!','good');dirty=true;}}
function gainGold(g){const n=Rd(g*goldMul());S.gold+=n;return n;}
function pstats(){const c=CL[S.cls]||CL.ranger;const cl=lvlOf(S.xp.combat);let a=0,d=0,h=0,cr=0;
  for(const s of SLOTS){const it=IT[S.eq[s]];if(it){a+=it.atk||0;d+=it.def||0;h+=it.hp||0;cr+=it.crit||0;}}
  let atk=(4+cl*1.2+a)*c.atk,def=(2+cl*.8+d)*c.def,hp=(60+cl*8+h)*c.hp;
  const bf=S.buffs;if(bf.atk)atk*=1+bf.atk.pct/100;if(bf.def)def*=1+bf.def.pct/100;if(bf.hp)hp*=1+bf.hp.pct/100;
  return{cl,atk,def,hp:Math.floor(hp),crit:Math.min(.8,c.crit+cr),regen:c.regen||0};}
function pickFood(missing){const f=Object.keys(S.inv).filter(id=>IT[id]&&IT[id].heal).sort((a,b)=>IT[a].heal-IT[b].heal);if(!f.length)return null;let best=null;for(const id of f)if(IT[id].heal<=missing)best=id;return best||f[0];}
const grant=id=>{add(id);log('Loot: '+IT[id].icon+' '+IT[id].name+'!','gold');};
const dropRoll=(list,mult=1)=>{for(const[id,ch]of list)if(Math.random()<Math.min(1,ch*mult))grant(id);};
function lootPity(key,ids,ch,need){let got=false;for(const id of ids)if(Math.random()<ch){got=true;grant(id);}
  S.pity[key]=(S.pity[key]||0)+1;if(got)S.pity[key]=0;else if(S.pity[key]>=need){grant(ids[Math.floor(Math.random()*ids.length)]);S.pity[key]=0;}}
const score=it=>(it.atk||0)*3+(it.def||0)*2+(it.hp||0)*.25+(it.crit||0)*600;
const statStr=it=>[it.atk?`ATK <b>${it.atk}</b>`:'',it.def?`DEF <b>${it.def}</b>`:'',it.hp?`HP <b>+${it.hp}</b>`:'',it.crit?`Crit <b>+${Math.round(it.crit*100)}%</b>`:'',it.heal?`Heals <b>${it.heal}</b>`:'',it.elix?`+${it.pct}% ${ELN[it.elix]} for 10 min`:''].filter(Boolean).join(' · ');

/* ---------- Guild party ---------- */
const gf=()=>Math.min(1,.45+.02*gl());
function memStat(m,P){const f=gf();
  if(m.role==='dps')return{atk:P.atk*f,hp:P.hp*f*.9,heal:0,tank:0};
  if(m.role==='healer')return{atk:P.atk*f*.25,hp:P.hp*f*.9,heal:P.hp*.05*f,tank:0};
  return{atk:P.atk*f*.4,hp:P.hp*f*1.6,heal:0,tank:1};}
function agg(list,P){let dps=0,heal=0,hp=0,t=0;for(const m of list){const q=memStat(m,P);dps+=q.atk*.6;heal+=q.heal;hp+=q.hp;t+=q.tank;}return{dps,heal,hp,mit:Math.min(.4,t*.2)};}
function autoParty(limit){const m=S.guild.members,pick=[];const take=(role,n)=>{for(const x of m){if(n<=0||pick.length>=limit)break;if(x.role===role&&!pick.includes(x)){pick.push(x);n--;}}};
  take('tank',1);take('healer',Math.ceil((limit+1)/5));take('dps',limit);take('healer',limit);take('tank',limit);return pick;}
const dungeonParty=()=>S.party.map(id=>S.guild.members.find(x=>x.id===id)).filter(Boolean);

/* ---------- Activities ---------- */
function cycle(x){
  if(x.in){for(const i in x.in)if(have(i)<x.in[i])return false;for(const i in x.in)rem(i,x.in[i]);}
  add(x.out,1);gainXp(x.skill,x.xp);return true;
}
function startAct(a){S.act=a;S.prog=0;C={mon:null,acc:0};R.acc=0;if(a&&a.t==='raid')raidInit();render();}
function spawn(){const a=S.act;let m;
  if(a.t==='zone'){const z=ZN[a.id];m={...z.mons[Math.floor(Math.random()*z.mons.length)]};if(Math.random()<.06){m.elite=true;m.name='Elite '+m.name;m.hp=Rd(m.hp*2.5);m.atk=Rd(m.atk*1.15);m.xp*=4;m.gold*=3;}}
  else m={...DG[a.id].seq[a.i]};
  C.mon={...m,mhp:m.hp};}
function defeat(){log('You were defeated and wake at the shrine.','bad');S.act=null;S.hp=Math.floor(pstats().hp*.5);C={mon:null,acc:0};dirty=true;}
function combatTick(){
  const P=pstats();if(S.hp==null||S.hp>P.hp)S.hp=P.hp;if(!C.mon)spawn();const m=C.mon,act=S.act;
  const pt=act.t==='dungeon'?dungeonParty().map(x=>memStat(x,P)):[];let ate=false;
  if(S.hp<P.hp*.5){const f=pickFood(P.hp-S.hp);if(f){rem(f);S.hp=Math.min(P.hp,S.hp+IT[f].heal);ate=true;}}
  if(!ate){let d=P.atk*rnd(.75,1.25)*P.atk/(P.atk+m.def);if(Math.random()<P.crit)d*=1.8;m.mhp-=d;}
  for(const q of pt){const a=q.atk*rnd(.8,1.2);m.mhp-=a*a/(a+m.def);if(q.heal)S.hp=Math.min(P.hp,S.hp+q.heal*1.5);}
  if(m.mhp<=0){
    S.stats.kills++;gainXp('combat',m.xp);const g=gainGold(m.gold*rnd(.7,1.3));
    if(act.t==='zone'){const z=ZN[act.id];dropRoll([[z.hide,.35],[z.trophy,.2]],m.elite?2:1);dropRoll(z.rare.map(id=>[id,.02]),m.elite?6:1);}
    else{const d=DG[act.id];dropRoll([[d.hide,.3]]);
      if(m.boss){log('Cleared '+d.name+'! +'+fmt(g)+' gold','gold');S.guild.xp+=d.gxp;S.stats.clears[d.id]=(S.stats.clears[d.id]||0)+1;lootPity('d'+d.id,d.loot,.1,6);act.i=0;}else act.i++;}
    C.mon=null;S.hp=Math.min(P.hp,S.hp+P.hp*P.regen);return;
  }
  const share=pt.length?(pt.some(q=>q.tank)?.6:1)/(pt.length+1):1;
  const md=m.atk*rnd(.75,1.25)*m.atk/(m.atk+P.def)*share;
  S.hp=Math.min(P.hp,S.hp-md+P.hp*P.regen);
  if(S.hp<=0)defeat();
}
function raidInit(){const r=RD[S.act.id],b=r.bosses[S.act.b],P=pstats();R.c=agg(autoParty(r.size-1),P);R.max=P.hp+R.c.hp;R.pool=R.max;R.bhp=b.hp;R.t=0;R.eat=0;}
function raidTick(){
  const r=RD[S.act.id],b=r.bosses[S.act.b],P=pstats(),c=R.c;R.t++;
  R.bhp-=P.atk*.6*(1+P.crit*.8)+c.dps;
  if(R.bhp<=0){const g=gainGold(b.gold);gainXp('combat',b.xp);S.guild.xp+=b.gxp;log(b.name+' falls! +'+fmt(g)+' gold','gold');lootPity('r'+r.id+'_'+S.act.b,b.loot,.08,5);
    S.act.b++;if(S.act.b>=r.bosses.length){S.act.b=0;S.stats.raids[r.id]=(S.stats.raids[r.id]||0)+1;log(r.name+' cleared!','good');}raidInit();dirty=true;return;}
  R.eat--;if(R.pool<R.max*.45&&R.eat<=0){const f=pickFood(R.max-R.pool);if(f){rem(f);R.pool=Math.min(R.max,R.pool+IT[f].heal);R.eat=3;}}
  const dmg=b.dps*(1+Math.max(0,R.t-b.enr)*.02)*(1-c.mit);
  R.pool=Math.min(R.max,R.pool-dmg+c.heal);
  if(R.pool<=0){log('Wipe on '+b.name+'. The raid regroups at the entrance.','bad');S.act=null;dirty=true;}
}
function tickBuffs(ms){for(const k of Object.keys(S.buffs)){S.buffs[k].left-=ms;if(S.buffs[k].left<=0){delete S.buffs[k];log('Your '+ELN[k]+' elixir wore off.','warn');dirty=true;}}}
function advance(ms){
  tickBuffs(ms);
  const a=S.act;const P=pstats();
  if(!a||a.t==='skill'||a.t==='raid'){if(S.hp==null)S.hp=P.hp;if(!a||a.t==='skill')S.hp=Math.min(P.hp,S.hp+ms/1000*P.hp*.02);}
  if(!a)return;
  if(a.t==='skill'){const x=ACT[a.id],dur=x.sec*1000/speed();S.prog+=ms;let n=Math.floor(S.prog/dur);S.prog-=n*dur;
    while(n-->0){if(!cycle(x)){S.act=null;S.prog=0;dirty=true;log('Out of materials for '+x.name+'.','warn');break;}}}
  else if(a.t==='zone'||a.t==='dungeon'){C.acc+=ms;let g=0;while(C.acc>=1500&&S.act&&g++<40000){C.acc-=1500;combatTick();}if(!S.act)C.acc=0;}
  else if(a.t==='raid'){R.acc+=ms;while(R.acc>=1000&&S.act&&S.act.t==='raid'){R.acc-=1000;raidTick();}}

function snap(){return{gold:S.gold,inv:{...S.inv},lv:Object.fromEntries(Object.keys(S.xp).map(k=>[k,lvlOf(S.xp[k])]))};}
function offline(ms){
  ms=Math.min(ms,12*3600e3);const a=S.act;
  if(a&&a.t==='raid'&&ms>600e3){S.act=null;log('The raid party disbanded while you were away.','warn');}
  const b=snap();advance(ms);const e=snap();
  if(ms<60e3)return;
  const items=Object.keys(e.inv).map(id=>[id,e.inv[id]-(b.inv[id]||0)]).filter(x=>x[1]!==0&&IT[x[0]]).sort((x,y)=>(IT[y[0]].rare?1:0)-(IT[x[0]].rare?1:0));
  const lv=Object.keys(e.lv).filter(k=>e.lv[k]>b.lv[k]).map(k=>(k==='combat'?'Combat':SKM[k].name)+' '+b.lv[k]+' → '+e.lv[k]);
  const mins=Math.round(ms/60000);
  modal(`<h2>Welcome back</h2><p>You were away for ${mins>=120?Math.round(mins/60)+' hours':mins+' minutes'}.</p>
   <div class="meta"><span>Gold <b>${e.gold-b.gold>=0?'+':''}${fmt(e.gold-b.gold)}</b></span>${lv.map(x=>`<span class="ok">${x}</span>`).join('')}</div>
   ${items.length?`<ul class="plain">${items.slice(0,14).map(([id,n])=>`<li>${IT[id].icon} ${IT[id].name} <b>${n>0?'+':''}${fmt(n)}</b></li>`).join('')}</ul>`:''}
   <button class="btn pri" data-do="close">Continue</button>`);
}

function vSkills(){

  const hidden=S.ui.all?0:acts.filter(a=>a.lvl>lv+12).length;
  if(!S.ui.all)acts=acts.filter(a=>a.lvl<=lv+12);
  return`<div class="sec-title"><h2>Skills</h2><p>Gather, then cook, brew, forge, tan and cut. Everything keeps running while you are away.</p></div>
   <div class="pills">${SK.map(s=>`<button class="pill" data-do="pickskill" data-id="${s.key}" aria-pressed="${s.key===S.ui.skill}"><b><span>${s.icon} ${s.name}</span><span data-b="lvl:${s.key}"></span></b><div class="bar"><i data-bar="xp:${s.key}"></i></div></button>`).join('')}</div>
   ${cats.length?`<div class="chips">${['All',...cats].map(c=>`<button class="chip" data-do="cat" data-id="${c}" aria-pressed="${c===cat}">${c}</button>`).join('')}</div>`:''}
   <div class="grid">${acts.map(actCard).join('')}</div>
   ${hidden?`<div class="chips"><span class="meta">${hidden} higher-level recipes hidden.</span><button class="chip" data-do="showall">Show all</button></div>`:(S.ui.all&&cur.acts.some(a=>a.lvl>lv+12)?`<div class="chips"><button class="chip" data-do="showall">Hide far-off recipes</button></div>`:'')}`;
}
function statLine(){const P=pstats();return`<span>ATK <b>${Math.round(P.atk)}</b></span><span>DEF <b>${Math.round(P.def)}</b></span><span>HP <b>${P.hp}</b></span><span>Crit <b>${Math.round(P.crit*100)}%</b></span>`;}
function buffLine(){const k=Object.keys(S.buffs);return k.length?k.map(x=>`<span class="ok">+${S.buffs[x].pct}% ${ELN[x]} <b data-b="buff:${x}"></b></span>`).join(''):'';}
const itemTag=id=>`<span>${IT[id].icon} ${IT[id].name}</span>`;
function vCombat(){
  const P=pstats(),foods=Object.keys(S.inv).filter(i=>IT[i].heal);
  return`<div class="sec-title"><h2>Combat</h2><p>You eat food automatically when health drops below half. Elites appear about one fight in sixteen and drop rare gear far more often.</p></div>
   <div class="card"><h3>${CL[S.cls]?CL[S.cls].name:''} · Combat level <span data-b="lvl:combat"></span></h3><div class="bar"><i data-bar="xp:combat"></i></div><div class="meta">${statLine()}<span>Kills <b>${fmt(S.stats.kills)}</b></span>${buffLine()}</div>
   <div class="meta">${foods.length?foods.map(i=>`<span>${IT[i].icon} ${IT[i].name} <b data-b="have:${i}"></b></span>`).join(''):'<span class="warn">No food in the bank. Cook fish or brew potions.</span>'}</div></div>
   <div class="grid">${ZN.map(z=>{const lock=P.cl<z.req,on=S.act&&S.act.t==='zone'&&S.act.id===z.id;
    return`<div class="card${on?' on':''}${lock?' lock':''}"><h3>${z.name}</h3><div class="meta"><span>Combat level <b class="${lock?'bad':''}">${z.req}</b></span></div>
     <div class="meta">${z.mons.map(m=>`<span>${m.name} <b>${fmt(m.hp)}</b> HP</span>`).join('')}</div>
     <div class="meta"><span>Drops</span>${itemTag(z.hide)}${itemTag(z.trophy)}</div>
     <div class="meta"><span>Rare</span>${z.rare.map(itemTag).join('')}</div>
     ${on?'<button class="btn" data-do="stop">Retreat</button>':`<button class="btn pri" data-do="zone" data-id="${z.id}" ${lock?'disabled':''}>${lock?'Locked':'Fight'}</button>`}</div>`;}).join('')}</div>`;
}
function vDungeons(){
  const P=pstats(),mem=S.guild.members,pt=dungeonParty();
  return`<div class="sec-title"><h2>Dungeons</h2><p>A run is a chain of rooms ending in a boss. Bring up to four guild members. Each boss guarantees a unique within six clears.</p></div>
   <div class="card"><h3>Your party <span class="tag">${pt.length}/4</span></h3>
    ${mem.length?`<div class="chips">${mem.map(m=>`<button class="chip" data-do="party" data-id="${m.id}" aria-pressed="${S.party.includes(m.id)}">${esc(m.name)} · ${ROLES[m.role]}</button>`).join('')}</div>
    <div class="meta"><span>Tanks draw attention, healers mend you, damage dealers speed fights. Members get stronger with guild level.</span></div>`:'<div class="meta"><span>Recruit members in the Guild tab to bring them along.</span></div>'}</div>
   <div class="grid">${DG.map(d=>{const lock=P.cl<d.req,on=S.act&&S.act.t==='dungeon'&&S.act.id===d.id,boss=d.seq[d.seq.length-1];
    return`<div class="card${on?' on':''}${lock?' lock':''}"><h3>${d.name}</h3><p style="margin:0;color:var(--mute);font-size:.9rem">${d.blurb}</p>
     <div class="meta"><span>Combat level <b class="${lock?'bad':''}">${d.req}</b></span><span>Rooms <b>${d.seq.length}</b></span><span>Cleared <b>${S.stats.clears[d.id]||0}</b></span></div>
     <div class="meta"><span>Boss <b>${d.boss}</b> · ${fmt(boss.hp)} HP</span></div>
     <div class="meta"><span>Unique</span>${d.loot.map(i=>`<span>${IT[i].icon} ${IT[i].name}</span>`).join('')}</div>
     ${on?`<div class="meta"><span>Room <b data-b="room"></b></span></div><button class="btn" data-do="stop">Leave</button>`:`<button class="btn pri" data-do="dungeon" data-id="${d.id}" ${lock?'disabled':''}>${lock?'Locked':'Enter'}</button>`}</div>`;}).join('')}</div>`;
}
function vRaids(){
  const P=pstats(),n=S.guild.members.length+1;
  const roles=r=>S.guild.members.filter(x=>x.role===r).length;
  return`<div class="sec-title"><h2>Raids</h2><p>Lead your guild against a boss chain. The raid takes the best mix from your roster: a tank, healers, then damage.</p></div>
   <div class="card"><h3>Your guild</h3><div class="meta"><span>Members <b>${n}</b> with you</span><span>Tanks <b>${roles('tank')}</b></span><span>Healers <b>${roles('healer')}</b></span><span>Damage <b>${roles('dps')}</b></span><span>Member strength <b>${Math.round(gf()*100)}%</b> of yours</span></div></div>
   <div class="grid">${RD.map(r=>{const lockCl=P.cl<r.cl,lockN=n<r.size,lock=lockCl||lockN,on=S.act&&S.act.t==='raid'&&S.act.id===r.id;
    return`<div class="card${on?' on':''}${lock?' lock':''}"><h3>${r.name}</h3>
     <div class="meta"><span>Party of <b class="${lockN?'bad':''}">${r.size}</b></span><span>Combat level <b class="${lockCl?'bad':''}">${r.cl}</b></span><span>Cleared <b>${S.stats.raids[r.id]||0}</b></span></div>
     <ul class="plain" style="font-size:.9rem;color:var(--mute)">${r.bosses.map((b,i)=>`<li${on&&S.act.b===i?' style="color:var(--brass)"':''}>${b.name} · ${fmt(b.hp)} HP</li>`).join('')}</ul>
     <div class="meta">${r.bosses.flatMap(b=>b.loot).map(i=>`<span>${IT[i].icon} ${IT[i].name}</span>`).join('')}</div>
     ${on?'<button class="btn" data-do="stop">Disband</button>':`<button class="btn pri" data-do="raid" data-id="${r.id}" ${lock?'disabled':''}>${lockN?'Needs '+(r.size-n)+' more members':lockCl?'Locked':'Start raid'}</button>`}</div>`;}).join('')}</div>`;
}
function recruitCost(){return Rd(300*Math.pow(S.guild.members.length+1,1.6));}
function vGuild(){
  const g=S.guild,m=g.members,cost=recruitCost(),full=m.length>=rosterCap()-1,lv=gl()+1;
  const cnt=r=>m.filter(x=>x.role===r).length;
  return`<div class="sec-title"><h2>Guild</h2><p>Dungeon and raid bosses earn guild experience. Higher guild level strengthens every member.</p></div>
   <div class="card"><label class="meta" for="gName">Guild name</label><input type="text" id="gName" maxlength="28" value="${esc(g.name)}">
    <div class="meta"><span>Level <b>${lv}</b></span><span>XP bonus <b>+${gl()}%</b></span><span>Member strength <b>${Math.round(gf()*100)}%</b></span><span>Roster <b>${m.length+1}/${rosterCap()}</b> (you included)</span></div><div class="bar"><i data-bar="gxp"></i></div></div>
   <div class="cols"><div class="card"><h3>Recruit</h3><div class="meta"><span>Cost <b>${fmt(cost)}</b> gold</span><span>Tanks <b>${cnt('tank')}</b></span><span>Healers <b>${cnt('healer')}</b></span><span>Damage <b>${cnt('dps')}</b></span></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap">${['tank','healer','dps'].map(r=>`<button class="btn pri" data-do="recruit" data-id="${r}" ${full||S.gold<cost?'disabled':''}>${ROLES[r]}</button>`).join('')}</div>${full?'<div class="warn">Roster full. Upgrade the Barracks.</div>':''}</div>
    <div class="card"><h3>Roster</h3><div class="table">${m.length?m.map(x=>`<div class="trow" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="nm">${esc(x.name)}</span><span class="tag">${ROLES[x.role]}</span><button class="btn sm" data-do="kick" data-id="${x.id}">Dismiss</button></div>`).join(''):'<span style="color:var(--mute)">Nobody yet. Recruit a tank, a healer and some damage dealers.</span>'}</div></div></div>
   <div class="grid">${HALL.map(([k,n,d])=>{const l=g.hall[k],c=Math.round(500*Math.pow(2,l)),max=l>=10;return`<div class="card"><h3>${n} <span class="tag">Lv ${l}</span></h3><div class="meta">${d}</div><button class="btn" data-do="hall" data-id="${k}" ${max||S.gold<c?'disabled':''}>${max?'Maxed':'Upgrade · '+fmt(c)+' gold'}</button></div>`;}).join('')}</div>`;
}
function vBank(){
  const f=S.ui.bank;
  let ids=Object.keys(S.inv).filter(i=>IT[i]);
  const kind=i=>IT[i].slot?'gear':(IT[i].heal||IT[i].elix)?'use':'mats';
  if(f!=='all')ids=ids.filter(i=>kind(i)===f);
  ids.sort((a,b)=>(IT[b].slot?1:0)-(IT[a].slot?1:0)||(IT[b].rare?1:0)-(IT[a].rare?1:0)||IT[a].name.localeCompare(IT[b].name));
  const trophies=Object.keys(S.inv).filter(i=>IT[i]&&IT[i].trophy);
  return`<div class="sec-title"><h2>Bank & Gear</h2><p>Gold <b class="warn" data-b="gold"></b></p></div>
   <div class="slots">${SLOTS.map(s=>{const it=IT[S.eq[s]];return`<div class="slot"><span class="lab">${SLN[s]}</span>${it?`<b>${it.icon} ${it.name}</b><span class="meta">${statStr(it)}</span><button class="btn sm" data-do="unequip" data-id="${s}">Unequip</button>`:'<span style="color:var(--mute)">Empty</span>'}</div>`;}).join('')}</div>
   <div class="card"><div class="meta">${statLine()}${buffLine()}</div><div class="chips"><button class="btn sm" data-do="autoequip">Equip best gear</button>${trophies.length?'<button class="btn sm" data-do="selltrophies">Sell all trophies</button>':''}</div></div>
   <div class="chips">${[['all','All'],['gear','Gear'],['use','Food & potions'],['mats','Materials']].map(([k,n])=>`<button class="chip" data-do="bankf" data-id="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>
   <div class="table">${ids.length?ids.map(i=>{const it=IT[i],eq=it.slot&&IT[S.eq[it.slot]],up=it.slot&&(!eq||score(it)>score(eq));
    return`<div class="trow"><span class="nm">${it.icon} ${it.name} <b>×${fmt(S.inv[i])}</b>${it.slot?` <span class="tag">${SLN[it.slot]}</span>`:''}${it.rare?' <span class="tag">Rare</span>':''}${up?' <span class="tag ok">Upgrade</span>':''}<span class="meta" style="display:block">${statStr(it)}</span></span><span class="meta">${fmt(it.val)}g</span>${it.slot?`<button class="btn sm" data-do="equip" data-id="${i}">Equip</button>`:it.elix?`<button class="btn sm" data-do="drink" data-id="${i}">Drink</button>`:'<span></span>'}<span style="display:flex;gap:6px"><button class="btn sm" data-do="sell1" data-id="${i}">Sell 1</button><button class="btn sm" data-do="sellall" data-id="${i}">Sell all</button></span></div>`;}).join(''):'<div class="card">Nothing here yet.</div>'}</div>`;
}
function vSave(){return`<div class="sec-title"><h2>Save</h2><p>Progress saves in this browser automatically.</p></div>
  <div class="card"><label class="meta" for="saveBox">Export or import</label><textarea id="saveBox" placeholder="Press Export to get your save code here, or paste one and press Import."></textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-do="export">Export</button><button class="btn" data-do="import">Import</button><button class="btn" data-do="reset" id="resetBtn">Reset everything</button></div></div>`;}
function render(){
  renderNav();const v={skills:vSkills,combat:vCombat,dungeons:vDungeons,raids:vRaids,guild:vGuild,bank:vBank,save:vSave}[S.ui.tab]||vSkills;
  $('#view').innerHTML=v();refresh();
}

/* ---------- Live bindings ---------- */
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function bval(k){const p=k.split(':');
  switch(p[0]){
    case'gold':return fmt(S.gold);
    case'have':return fmt(have(p[1]));
    case'in':return fmt(have(p[1]))+'/'+(+p[2]);
    case'lvl':return lvlOf(S.xp[p[1]]);
    case'buff':return S.buffs[p[1]]?mmss(S.buffs[p[1]].left):'';
    case'room':return S.act&&S.act.t==='dungeon'?(S.act.i+1)+'/'+DG[S.act.id].seq.length:'';
  }return'';}
function refresh(){
  $$('[data-b]').forEach(e=>{const v=String(bval(e.dataset.b));if(e.textContent!==v)e.textContent=v;if(e.dataset.b.startsWith('in:')){const p=e.dataset.b.split(':');e.className=have(p[1])>=+p[2]?'ok':'bad';}});
  $$('[data-bar]').forEach(e=>{const p=e.dataset.bar.split(':');let w=0;
    if(p[0]==='xp')w=pct(S.xp[p[1]]);else if(p[0]==='gxp')w=gpct();
    else if(p[0]==='prog'&&S.act&&S.act.t==='skill'){const x=ACT[S.act.id];w=S.prog/(x.sec*1000/speed())*100;}
    e.style.width=Math.min(100,w)+'%';});
  const P=pstats();if(S.hp==null)S.hp=P.hp;
  $('#hGold').textContent=fmt(S.gold);$('#hCl').textContent=P.cl;$('#hCls').textContent=CL[S.cls]?CL[S.cls].name:'-';$('#hHp').style.width=Math.max(0,S.hp/P.hp*100)+'%';
  const a=S.act,r2=$('#sR2');let lbl='Idle. Pick something to do.',b1=0,t1='',b2=0,t2='',two=false;
  if(a){
    if(a.t==='skill'){const x=ACT[a.id];lbl=(SKM[x.skill].icon)+' '+(x.in?'Crafting ':'Gathering ')+x.name;b1=S.prog/(x.sec*1000/speed())*100;t1=(x.sec/speed()).toFixed(1)+'s';}
    else if(a.t==='zone'||a.t==='dungeon'){const m=C.mon;const k=a.t==='dungeon'?dungeonParty().length:0;const nm=a.t==='zone'?ZN[a.id].name:DG[a.id].name+' · room '+(a.i+1)+'/'+DG[a.id].seq.length+(k?' · party of '+(k+1):'');lbl='⚔️ '+nm+(m?' · '+m.name:'');two=true;b1=m?Math.max(0,m.mhp/m.hp*100):100;t1=m?Math.max(0,Math.ceil(m.mhp))+'/'+m.hp:'';b2=S.hp/P.hp*100;t2=Math.ceil(Math.max(0,S.hp))+'/'+P.hp+' HP';}
    else if(a.t==='raid'){const r=RD[a.id],b=r.bosses[a.b];lbl='🏰 '+r.name+' · '+b.name;two=true;b1=Math.max(0,R.bhp/b.hp*100);t1=fmt(Math.max(0,R.bhp))+' HP';b2=R.pool/R.max*100;t2='Party '+fmt(Math.max(0,R.pool))+'/'+fmt(R.max);}
  }
  $('#sLbl').textContent=lbl;$('#sB1').style.width=Math.min(100,b1)+'%';$('#sT1').textContent=t1;r2.hidden=!two;$('#sB2').style.width=Math.min(100,Math.max(0,b2))+'%';$('#sT2').textContent=t2;
  $('#sB1w').className='bar'+(a&&a.t!=='skill'?' foe':'');$('#sStop').hidden=!a;
}

/* ---------- Input ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){S.ui.tab=tb.dataset.tab;render();return;}
  const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const id=b.dataset.id;
  switch(b.dataset.do){
    case'close':$('#modal').innerHTML='';break;
    case'pickcls':S.cls=id;S.hp=pstats().hp;$('#modal').innerHTML='';log('You join the realm as a '+CL[id].name+'.','good');render();break;
    case'pickskill':S.ui.skill=id;render();break;
    case'cat':S.ui.cat[S.ui.skill]=id;render();break;
    case'showall':S.ui.all=!S.ui.all;render();break;
    case'bankf':S.ui.bank=id;render();break;
    case'skill':startAct({t:'skill',id});break;
    case'stop':startAct(null);break;
    case'zone':startAct({t:'zone',id:+id});break;
    case'dungeon':startAct({t:'dungeon',id:+id,i:0});break;
    case'raid':startAct({t:'raid',id:+id,b:0});break;
    case'party':{const i=S.party.indexOf(id);if(i>=0)S.party.splice(i,1);else if(S.party.length<4)S.party.push(id);render();break;}
    case'recruit':{const cost=recruitCost();if(S.gold>=cost&&S.guild.members.length<rosterCap()-1){S.gold-=cost;const used=S.guild.members.map(x=>x.name);let nm=NAMES.find(n=>!used.includes(n));if(!nm){nm=NAMES[Math.floor(Math.random()*NAMES.length)]+' II';}else{const pool=NAMES.filter(n=>!used.includes(n));nm=pool[Math.floor(Math.random()*pool.length)];}
      S.guild.members.push({id:'m'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:nm,role:id});log('A new '+ROLES[id].toLowerCase()+' joins the guild.','good');}render();break;}
    case'kick':S.guild.members=S.guild.members.filter(x=>x.id!==id);S.party=S.party.filter(x=>x!==id);render();break;
    case'hall':{const l=S.guild.hall[id],c=Math.round(500*Math.pow(2,l));if(S.gold>=c&&l<10){S.gold-=c;S.guild.hall[id]++;log('Guild hall upgraded.','good');}render();break;}
    case'equip':{const it=IT[id],old=S.eq[it.slot];rem(id);if(old)add(old);S.eq[it.slot]=id;S.hp=Math.min(S.hp,pstats().hp);render();break;}
    case'unequip':if(S.eq[id]){add(S.eq[id]);S.eq[id]=null;S.hp=Math.min(S.hp,pstats().hp);}render();break;
    case'autoequip':{let n=0;for(const s of SLOTS){let best=S.eq[s],bs=best?score(IT[best]):-1;for(const i of Object.keys(S.inv)){const it=IT[i];if(it&&it.slot===s&&score(it)>bs){best=i;bs=score(it);}}
      if(best&&best!==S.eq[s]){rem(best);if(S.eq[s])add(S.eq[s]);S.eq[s]=best;n++;}}
      log(n?'Equipped '+n+' better item'+(n>1?'s':'')+'.':'You already wear your best gear.',n?'good':'');S.hp=Math.min(S.hp,pstats().hp);render();break;}
    case'drink':{const it=IT[id];if(have(id)>0){rem(id);S.buffs[it.elix]={pct:it.pct,left:600000};log('You drink '+it.name+'.','good');}render();break;}
    case'selltrophies':{let g=0;for(const i of Object.keys(S.inv))if(IT[i]&&IT[i].trophy){g+=IT[i].val*S.inv[i];delete S.inv[i];}S.gold+=g;log('Sold trophies for '+fmt(g)+' gold.','gold');render();break;}
    case'sell1':S.gold+=IT[id].val;rem(id);render();break;
    case'sellall':S.gold+=IT[id].val*have(id);delete S.inv[id];render();break;
    case'export':$('#saveBox').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#saveBox').select();break;
    case'import':try{const d=JSON.parse(decodeURIComponent(escape(atob($('#saveBox').value.trim()))));localStorage.setItem(KEY,JSON.stringify(d));location.reload();}catch(err){log('That save code could not be read.','bad');}break;
    case'reset':if(b.dataset.armed){try{localStorage.removeItem(KEY);}catch(er){}S=fresh();C={mon:null,acc:0};logEl.innerHTML='';render();pickClass();}else{b.dataset.armed='1';b.textContent='Click again to erase your save';}break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='gName'){S.guild.name=e.target.value.trim()||'The Wayfarers';}});
function pickClass(){modal(`<h2>Choose your calling</h2><p style="margin:0;color:var(--mute)">Your class shapes how you fight. Gathering and crafting are open to everyone.</p><div class="classes">${Object.entries(CL).map(([k,c])=>`<button data-do="pickcls" data-id="${k}"><b>${c.name}</b><span>${c.d}</span></button>`).join('')}</div>`);}

/* ---------- Boot ---------- */
if(!S.cls)pickClass();else{const away=Date.now()-S.seen;if(away>1000)offline(away);}
render();
if(!logEl.children.length)log('Welcome to Embermark. Start mining, fishing or herb gathering, then work toward dungeons and raids.');
let last=Date.now();
setInterval(()=>{const n=Date.now(),dt=n-last;last=n;if(!S.cls)return;if(dt>3000)offline(dt);else advance(dt);refresh();if(dirty){dirty=false;render();}},100);
setInterval(save,5000);
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

})();
</script>
</body>
</html>
